<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff App Installs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 440px;
            width: 100%;
            padding: 32px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-chef {
            background: #ea580c;
        }
        .btn-chef:hover {
            opacity: 0.92;
        }
        .btn-reception {
            background: #059669;
        }
        .btn-reception:hover {
            opacity: 0.92;
        }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Staff Portal</span>
        <h1>Kitchen & Reception Apps</h1>
        <p>Install the dedicated companion applications for order management, live KDS ticketing, and front-desk notifications.</p>

        <div class="button-group">
            <a href="{{ url_for('static', filename='apks/ChefApp.apk') }}" class="btn btn-chef" download>
                <span>👨‍🍳</span> Download Chef App
            </a>
            
            <a href="{{ url_for('static', filename='apks/ReceptionApp.apk') }}" class="btn btn-reception" download>
                <span>🛎️</span> Download Reception App
            </a>
        </div>

        <div class="note">Designed for staff-managed tablets and mobile devices.</div>
    </div>
</body>
</html>
