<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hotel Operations - Statistics</title>
    <style>
        :root {
            --bg: #f8f5ec;
            --card-border: #ded3b8;
            --text-main: #302a20;
            --text-muted: #766d5d;
            --primary: #b8953f;
            --primary-dark: #927326;
            --success: #18a878;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #fffdf8 0%, #f8f5ec 55%, #f4efe2 100%);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: max(2rem, env(safe-area-inset-bottom));
        }

        header {
            background: rgba(255, 253, 247, 0.96);
            border-bottom: 1px solid var(--card-border);
            padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 3px 14px rgba(100, 75, 25, 0.08);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 800;
            color: #302a20;
        }

        .back-btn {
            background: #fffdf7;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 1.25rem auto;
            padding: 0 1rem;
        }

        .section-box {
            background: rgba(255,253,247,0.94);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 5px 18px rgba(90,70,30,0.07);
        }

        .stats-periods { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.25rem; }
        .stats-period-btn {
            border: 1px solid var(--card-border);
            background: #fff;
            color: var(--text-main);
            border-radius: 999px;
            padding: 0.65rem 1.15rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .stats-period-btn.active {
            background: linear-gradient(135deg, #d8bd70, #b8953f);
            color: #fff;
            border-color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(184, 149, 63, 0.25);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.85rem;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 600px) {
            .stats-summary { grid-template-columns: 1fr; }
        }

        .stats-card {
            padding: 1rem;
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            box-shadow: 0 3px 10px rgba(90,70,30,0.04);
        }
        .stats-card span { color: var(--text-muted); font-size: 0.82rem; font-weight: 600; }
        .stats-card strong { font-size: 1.4rem; color: var(--primary-dark); font-weight: 800; }

        .table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
        }

        .stats-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }
        .stats-table th {
            padding: 0.8rem 1rem;
            text-align: left;
            background: #f7f2e7;
            color: var(--text-muted);
            font-size: 0.82rem;
            text-transform: uppercase;
        }
        .stats-table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.86rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>📊</span>
            <span>Order Statistics</span>
        </div>
        <a href="/admin" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="container">
        <div class="section-box">
            <div class="stats-periods">
                <button class="stats-period-btn active" onclick="loadStats('today', this)">Today’s Orders</button>
                <button class="stats-period-btn" onclick="loadStats('30days', this)">Last 30 Days</button>
                <button class="stats-period-btn" onclick="loadStats('6months', this)">Last 6 Months</button>
            </div>

            <div class="stats-summary">
                <div class="stats-card"><span>Total Orders Placed</span><strong id="statsCount">—</strong></div>
                <div class="stats-card"><span>Total Value (Gross)</span><strong id="statsTotal">₹0.00</strong></div>
                <div class="stats-card"><span>Total Paid Collected</span><strong id="statsPaid" style="color:var(--success);">₹0.00</strong></div>
            </div>

            <div class="table-wrap">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Date & Time</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="statsBody">
                        <tr><td colspan="7" style="text-align:center;">Loading statistics…</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="emptyMsg" style="display:none; text-align:center; padding:1.5rem; color:var(--text-muted);">No orders found for this period.</p>
        </div>
    </div>

    <script>
        let currentPeriod = 'today';

        async function loadStats(period, btn) {
            currentPeriod = period;
            document.querySelectorAll('.stats-period-btn').forEach(b => b.classList.toggle('active', b === btn));
            const tbody = document.getElementById("statsBody");
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Loading statistics…</td></tr>';

            try {
                const res = await fetch(`/api/admin/statistics?period=${encodeURIComponent(period)}`);
                const data = await res.json();

                if (!res.ok || !data.success) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Failed loading statistics.</td></tr>';
                    return;
                }

                document.getElementById("statsCount").textContent = data.order_count;
                document.getElementById("statsTotal").textContent = "₹" + Number(data.total_amount).toFixed(2);
                document.getElementById("statsPaid").textContent = "₹" + Number(data.paid_amount).toFixed(2);

                if (!data.orders || data.orders.length === 0) {
                    tbody.innerHTML = '';
                    document.getElementById("emptyMsg").style.display = "block";
                    return;
                }

                document.getElementById("emptyMsg").style.display = "none";
                tbody.innerHTML = data.orders.map(o => `
                    <tr>
                        <td><strong>Token #${o.token || o.id}</strong></td>
                        <td>${o.username}<br><small style="color:var(--text-muted);">${o.email}</small></td>
                        <td>${o.created_at}</td>
                        <td style="text-transform:capitalize;">${o.order_type === 'parcel' ? '📦 Parcel' : '🍽️ Dine In'}</td>
                        <td><span style="font-weight:700; text-transform:uppercase;">${o.status}</span></td>
                        <td><span style="font-weight:700; color:${o.payment_status === 'paid' ? 'var(--success)' : '#c53d3d'}">${o.payment_status.toUpperCase()}</span></td>
                        <td><strong>₹${Number(o.total).toFixed(2)}</strong></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Network error while fetching statistics.</td></tr>';
            }
        }

        loadStats('today', document.querySelector('.stats-period-btn'));
        setInterval(() => loadStats(currentPeriod, document.querySelector('.stats-period-btn.active')), 10000);
    </script>
</body>
</html>
