<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link id="appManifest" rel="manifest" href="/manifest/{{ "chef" if pwa_role == "chef" else "reception" }}.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Orders</title>
    <style>
        :root {
            --bg: #f8f5ec;
            --card: #fffdf7;
            --border: #ded3b8;
            --ink: #302a20;
            --muted: #766d5d;
            --gold: #b8953f;
            --green: #16865f;
            --red: #d94b4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #fffdf8 0%, #f4efe2 100%);
            color: var(--ink);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 14px;
            background: #fffdf7;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 { font-size: 1.05rem; margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 6px; }

        .btn-link, .btn-action-top {
            color: #49391a;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            background: #fffaf0;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .sound-badge {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 5px 8px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fffaf0;
        }

        main {
            max-width: 1400px;
            margin: 14px auto;
            padding: 0 10px;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        @media (max-width: 500px) {
            .orders-grid { grid-template-columns: 1fr; }
        }

        .order-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 14px rgba(90, 70, 18, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
        }

        .token {
            background: #10b981;
            color: #ffffff;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 800;
        }

        .muted { color: var(--muted); font-size: 0.78rem; }

        .click-hint {
            font-size: 0.72rem;
            color: var(--gold);
            text-align: center;
            font-weight: 700;
            background: #fff9eb;
            padding: 4px;
            border-radius: 6px;
            border: 1px dashed #e8dec4;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            border-top: 1px solid #e8dec4;
            padding-top: 8px;
            font-size: 0.92rem;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .btn-preparing {
            background: #fee2e2;
            color: #b91c1c;
            border: 1.5px solid #ef4444;
            border-radius: 8px;
            padding: 8px 4px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .btn-preparing.active { background: #ef4444; color: #ffffff; }

        .btn-prepared {
            background: #dcfce7;
            color: #15803d;
            border: 1.5px solid #22c55e;
            border-radius: 8px;
            padding: 8px 4px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 800;
            border-radius: 999px;
            padding: 3px 7px;
            background: #f0e7d1;
        }

        .status {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            background: #fffdf7;
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        .items-2col-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .item-box {
            background: #fdfbf5;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .item-qty-top {
            background: #b8953f;
            color: #ffffff;
            font-size: 0.76rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .item-img {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #f0eadb;
        }
        .item-name-bottom {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--ink);
            word-break: break-word;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(23, 19, 13, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
            z-index: 50;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            width: min(420px, 100%);
            background: #fffdf7;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }
        .modal-actions button {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 800;
            cursor: pointer;
            background: #fffaf0;
            font-size: 0.82rem;
        }
        .btn-confirm-yes {
            background: linear-gradient(135deg, #d8bd70, #b8953f) !important;
            color: #ffffff !important;
            border-color: #927326 !important;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            padding: 10px 16px;
            border-radius: 10px;
            background: #302a20;
            color: #ffffff;
            transition: 0.2s ease;
            font-size: 0.85rem;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: #b42318; }
    </style>
<script>window.PWA_ROLE="{{ pwa_role|default('chef') }}";</script>
<script src="/static/js/pwa.js" defer></script>
</head>
<body>
    <header>
        <h1>🍳 Cooking Orders <span id="count" class="badge">0</span></h1>
        <div class="header-actions">
            <button class="sound-badge" id="cookingNotificationButton" type="button">🔔 Enable notifications</button>
            <button class="sound-badge" id="soundBtn" onclick="toggleSound()">🔔 Sound: ON</button>
            <a href="/admin" class="btn-link">&larr; Admin</a>
            <button class="btn-action-top" onclick="loadOrders()">&#8635; Refresh</button>
        </div>
    </header>

    <main>
        <div id="orders" class="orders-grid">
            <div class="status" style="grid-column: 1 / -1;">Loading orders&hellip;</div>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-backdrop">
        <div class="modal" onclick="event.stopPropagation()">
            <div style="font-size:1.8rem; margin-bottom:4px;">⚠️️</div>
            <h3 id="confirmTitle" style="font-size:1.1rem; margin-bottom:4px;">Confirm Action</h3>
            <p id="confirmMsg" style="color:var(--muted); font-size:0.85rem; margin-bottom:12px;"></p>
            <div class="modal-actions" style="justify-content:center;">
                <button type="button" onclick="closeConfirm(false)">Cancel</button>
                <button type="button" class="btn-confirm-yes" onclick="closeConfirm(true)">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Order Items Modal (2 Items per row, Qty on top, Photo) -->
    <div id="itemDetailModal" class="modal-backdrop" onclick="closeItemModal(event)">
        <div class="modal" onclick="event.stopPropagation()" style="text-align:left;">
            <h2 id="modalOrderTitle" style="margin: 0 0 4px; font-size: 1.05rem;"></h2>
            <div id="modalCustomerText" class="muted" style="margin-bottom: 8px;"></div>
            <div id="modalItemsGrid" class="items-2col-grid"></div>
            <div class="modal-actions">
                <button type="button" onclick="closeItemModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let cachedOrders = [];
        let toastTimeout = null;
        let confirmResolve = null;
        let audioCtx = null;
        let soundEnabled = true;
        let lastCookingCount = null;

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Unlock audio context on initial page touch or click
        ['click', 'touchstart', 'keydown'].forEach(ev => {
            window.addEventListener(ev, () => { initAudio(); }, { once: true });
        });

        function toggleSound() {
            soundEnabled = !soundEnabled;
            initAudio();
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔔 Sound: ON' : '🔕 Sound: OFF';
            btn.style.color = soundEnabled ? 'var(--green)' : 'var(--red)';
            if (soundEnabled) playKitchenChime();
        }

        function playKitchenChime() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                // High-visibility kitchen chime: 587.33Hz (D5) -> 880Hz (A5)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(587.33, now);
                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.5);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(880, now + 0.18);
                gain2.gain.setValueAtTime(0.5, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.8);
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        function showToast(message, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.toggle('error', isError);
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 2400);
        }

        function showConfirmPopup(title, message) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMsg').textContent = message;
            document.getElementById('confirmModal').classList.add('show');
            if (window.appPopupNotification) window.appPopupNotification(title, message, "/chef");
            return new Promise(resolve => { confirmResolve = resolve; });
        }

        function closeConfirm(val) {
            document.getElementById('confirmModal').classList.remove('show');
            if (confirmResolve) confirmResolve(val);
        }

        function openItemModal(orderId) {
            const o = cachedOrders.find(item => item.id === orderId);
            if (!o) return;

            document.getElementById('modalOrderTitle').textContent = `Token #${o.daily_order_number} Items`;
            document.getElementById('modalCustomerText').textContent = `Customer: ${o.username} · Placed: ${o.date} ${o.time} · Total: ₹${Number(o.total_amount).toFixed(2)}`;

            const grid = document.getElementById('modalItemsGrid');
            grid.innerHTML = (o.items || []).map(item => `
                <div class="item-box">
                    <div class="item-qty-top">Qty: ${escapeHtml(item.quantity)}</div>
                    <img src="${item.photo_url || 'https://via.placeholder.com/54'}" class="item-img" alt="${escapeHtml(item.name)}" onerror="this.src='https://via.placeholder.com/54'"/>
                    <div class="item-name-bottom">${escapeHtml(item.name)}</div>
                </div>
            `).join('');

            document.getElementById('itemDetailModal').classList.add('show');
        }

        function closeItemModal(e) {
            if (!e || e.target.id === 'itemDetailModal' || e.target.tagName === 'BUTTON') {
                document.getElementById('itemDetailModal').classList.remove('show');
            }
        }

        async function updateStatus(e, id, status) {
            e.stopPropagation();

            const actionLabel = status === 'prepared' ? 'PREPARED (will clear from cooking queue)' : status.toUpperCase();
            const confirmed = await showConfirmPopup('Update Status', `Mark Token #${id} as ${actionLabel}?`);
            if (!confirmed) return;

            try {
                const res = await fetch('/api/admin/order/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: id, status: status })
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || 'Update failed');
                showToast(`Order updated to ${status.toUpperCase()}`);
                await loadOrders();
            } catch (err) {
                showToast(err.message || 'Could not update status', true);
            }
        }

        async function loadOrders() {
            const box = document.getElementById('orders');
            try {
                const res = await fetch('/api/admin/cooking-orders', { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load orders');

                const data = await res.json();
                cachedOrders = data.orders || [];
                const currentCount = cachedOrders.length;
                document.getElementById('count').textContent = currentCount;

                // Sound triggers whenever new paid cooking orders arrive
                if (lastCookingCount !== null && currentCount > lastCookingCount) {
                    playKitchenChime();
                }
                lastCookingCount = currentCount;

                if (!cachedOrders.length) {
                    box.innerHTML = '<div class="status" style="grid-column: 1 / -1;">No active cooking orders right now.</div>';
                    return;
                }

                box.innerHTML = cachedOrders.map(o => {
                    const type = o.order_type === 'parcel' ? '📦 Parcel' : '🍽 Dine in';
                    const isPrep = o.order_status === 'preparing';

                    return `
                        <article class="order-card" onclick="openItemModal(${o.id})">
                            <div class="order-head">
                                <div>
                                    <span class="token">Token #${escapeHtml(o.daily_order_number)}</span>
                                    <div style="font-weight: 800; margin-top: 4px; font-size:0.92rem;">${escapeHtml(o.username)}</div>
                                    <div class="muted">🕒 ${escapeHtml(o.time)} · ${escapeHtml(type)}</div>
                                </div>
                                <div style="text-align: right;">
                                    <span class="badge" style="background:${isPrep ? '#fee2e2; color:#b91c1c;' : '#f0e7d1; color:#766d5d;'}">${escapeHtml(o.order_status.toUpperCase())}</span>
                                    <div class="muted" style="margin-top: 4px;">🟢 PAID</div>
                                </div>
                            </div>

                            <div class="click-hint">&#128070; Tap to view items (${o.items ? o.items.length : 0})</div>

                            <div class="total">
                                <span>Total</span>
                                <span>₹${Number(o.total_amount).toFixed(2)}</span>
                            </div>

                            <div class="actions">
                                <button type="button" class="btn-preparing ${isPrep ? 'active' : ''}" onclick="updateStatus(event, ${o.id}, 'preparing')">
                                    🍳 Preparing
                                </button>
                                <button type="button" class="btn-prepared" onclick="updateStatus(event, ${o.id}, 'prepared')">
                                    ✅ Prepared
                                </button>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (err) {
                box.innerHTML = `<div class="status" style="grid-column: 1 / -1;">${escapeHtml(err.message || 'Could not load orders.')}</div>`;
            }
        }

        loadOrders();
        setInterval(loadOrders, 4000);
        document.addEventListener('DOMContentLoaded', () => {
            if (window.bindAppNotificationButton) {
                window.bindAppNotificationButton(document.getElementById('cookingNotificationButton'));
            }
        });
    </script>
</body>
</html>
