<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Orders</title>
    <style>
        :root {
            --bg: #f8f5ec;
            --card: #fffdf7;
            --border: #ded3b8;
            --ink: #302a20;
            --muted: #766d5d;
            --gold: #b8953f;
            --green: #16865f;
            --red: #d94b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: linear-gradient(180deg, #fffdf8 0%, #f4efe2 100%); color: var(--ink); min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(14px, 3vw, 32px); background: #fffdf7; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        h1 { font-size: 1.2rem; margin: 0; }
        .btn-link, .btn-action-top { color: #49391a; font-weight: 700; text-decoration: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: #fffaf0; cursor: pointer; font-size: 0.88rem; }
        main { max-width: 1400px; margin: 20px auto; padding: 0 14px 40px; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
        .order-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; box-shadow: 0 5px 18px rgba(90, 70, 18, 0.05); display: flex; flex-direction: column; gap: 11px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(90, 70, 18, 0.08); }
        .order-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .token { background: #10b981; color: #ffffff; padding: 4px 8px; border-radius: 8px; font-size: 0.78rem; font-weight: 800; }
        .muted { color: var(--muted); font-size: 0.82rem; }
        .click-hint { font-size: 0.75rem; color: var(--gold); text-align: center; font-weight: 700; background: #fff9eb; padding: 5px; border-radius: 6px; border: 1px dashed #e8dec4; }
        .total { display: flex; justify-content: space-between; font-weight: 800; border-top: 1px solid #e8dec4; padding-top: 10px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .btn-preparing { background: #fee2e2; color: #b91c1c; border: 2px solid #ef4444; border-radius: 10px; padding: 10px 6px; font-weight: 800; font-size: 0.84rem; cursor: pointer; transition: 0.15s; }
        .btn-preparing.active { background: #ef4444; color: #ffffff; }
        .btn-prepared { background: #dcfce7; color: #15803d; border: 2px solid #22c55e; border-radius: 10px; padding: 10px 6px; font-weight: 800; font-size: 0.84rem; cursor: pointer; transition: 0.15s; }
        .badge { font-size: 0.75rem; font-weight: 800; border-radius: 999px; padding: 4px 8px; background: #f0e7d1; }
        .status { padding: 36px; text-align: center; color: var(--muted); background: #fffdf7; border: 1px dashed var(--border); border-radius: 14px; }
        .spinner { width: 34px; height: 34px; border: 4px solid #e8dec4; border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 2-Columns Item Grid with Quantity on Top & Dish Photo */
        .items-2col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; max-height: 60vh; overflow-y: auto; padding: 2px; }
        .item-box { background: #fdfbf5; border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
        .item-qty-top { background: #b8953f; color: #ffffff; font-size: 0.82rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; }
        .item-img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); background: #f0eadb; }
        .item-name-bottom { font-weight: 700; font-size: 0.88rem; color: var(--ink); word-break: break-word; }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(23, 19, 13, 0.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
        .modal-backdrop.show { display: flex; }
        .modal { width: min(460px, 100%); background: #fffdf7; border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 22px 70px rgba(0, 0, 0, 0.25); text-align: center; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
        .modal-actions button { border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; font-weight: 800; cursor: pointer; background: #fffaf0; font-size: 0.88rem; }
        .btn-confirm-yes { background: linear-gradient(135deg, #d8bd70, #b8953f) !important; color: #ffffff !important; border-color: #927326 !important; }
        .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; padding: 12px 18px; border-radius: 12px; background: #302a20; color: #ffffff; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); transition: 0.2s ease; font-size: 0.9rem; text-align: center; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: #b42318; }
    </style>
</head>
<body>
    <header>
        <h1>🍳 Cooking Orders <span id="count" class="badge">0</span></h1>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a href="/admin" class="btn-link">&larr; Admin Dashboard</a>
            <button class="btn-action-top" onclick="loadOrders()">&#8635; Refresh</button>
        </div>
    </header>

    <main>
        <div id="orders" class="orders-grid">
            <div class="status" style="grid-column: 1 / -1;">
                <div class="spinner"></div>
                Loading paid cooking orders&hellip;
            </div>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-backdrop">
        <div class="modal" onclick="event.stopPropagation()">
            <div style="font-size:2rem; margin-bottom:6px;">⚠️</div>
            <h3 id="confirmTitle" style="font-size:1.15rem; margin-bottom:6px;">Confirm Action</h3>
            <p id="confirmMsg" style="color:var(--muted); font-size:0.88rem; margin-bottom:14px;"></p>
            <div class="modal-actions" style="justify-content:center;">
                <button type="button" onclick="closeConfirm(false)">Cancel</button>
                <button type="button" class="btn-confirm-yes" onclick="closeConfirm(true)">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Order Items Modal (2 Items per row, Qty on top, Photo) -->
    <div id="itemDetailModal" class="modal-backdrop" onclick="closeItemModal(event)">
        <div class="modal" onclick="event.stopPropagation()" style="text-align:left;">
            <h2 id="modalOrderTitle" style="margin: 0 0 4px; font-size: 1.15rem;"></h2>
            <div id="modalCustomerText" class="muted" style="margin-bottom: 12px;"></div>
            <div id="modalItemsGrid" class="items-2col-grid"></div>
            <div class="modal-actions">
                <button type="button" onclick="closeItemModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let cachedOrders = [];
        let toastTimeout = null;
        let confirmResolve = null;

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.toggle('error', isError);
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 2400);
        }

        function showConfirmPopup(title, message) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMsg').textContent = message;
            document.getElementById('confirmModal').classList.add('show');
            return new Promise(resolve => { confirmResolve = resolve; });
        }

        function closeConfirm(val) {
            document.getElementById('confirmModal').classList.remove('show');
            if (confirmResolve) confirmResolve(val);
        }

        function openItemModal(orderId) {
            const o = cachedOrders.find(item => item.id === orderId);
            if (!o) return;

            document.getElementById('modalOrderTitle').textContent = `Token #${o.daily_order_number} Food Items`;
            document.getElementById('modalCustomerText').textContent = `Customer: ${o.username} · Placed: ${o.date} ${o.time} · Total: ₹${Number(o.total_amount).toFixed(2)}`;

            const grid = document.getElementById('modalItemsGrid');
            grid.innerHTML = (o.items || []).map(item => `
                <div class="item-box">
                    <div class="item-qty-top">Qty: ${escapeHtml(item.quantity)}</div>
                    <img src="${item.photo_url || 'https://via.placeholder.com/64'}" class="item-img" alt="${escapeHtml(item.name)}" onerror="this.src='https://via.placeholder.com/64'"/>
                    <div class="item-name-bottom">${escapeHtml(item.name)}</div>
                </div>
            `).join('');

            document.getElementById('itemDetailModal').classList.add('show');
        }

        function closeItemModal(e) {
            if (!e || e.target.id === 'itemDetailModal' || e.target.tagName === 'BUTTON') {
                document.getElementById('itemDetailModal').classList.remove('show');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeItemModal();
                closeConfirm(false);
            }
        });

        async function updateStatus(e, id, status) {
            e.stopPropagation();

            const actionLabel = status === 'prepared' ? 'PREPARED and remove from cooking orders' : status.toUpperCase();
            const confirmed = await showConfirmPopup('Update Cooking Status', `Mark Token #${id} as ${actionLabel}?`);
            if (!confirmed) return;

            try {
                const res = await fetch('/api/admin/order/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: id, status: status })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Update failed');
                }
                showToast(`Order status updated to ${status.toUpperCase()}`);
                await loadOrders();
            } catch (err) {
                showToast(err.message || 'Could not update status', true);
            }
        }

        async function loadOrders() {
            const box = document.getElementById('orders');
            try {
                const res = await fetch('/api/admin/cooking-orders', { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load orders from server');

                const data = await res.json();
                cachedOrders = data.orders || [];
                document.getElementById('count').textContent = cachedOrders.length;

                if (!cachedOrders.length) {
                    box.innerHTML = '<div class="status" style="grid-column: 1 / -1;">No active cooking orders right now.</div>';
                    return;
                }

                box.innerHTML = cachedOrders.map(o => {
                    const type = o.order_type === 'parcel' ? '📦 Parcel' : '🍽 Dine in';
                    const isPrep = o.order_status === 'preparing';

                    return `
                        <article class="order-card" onclick="openItemModal(${o.id})">
                            <div class="order-head">
                                <div>
                                    <span class="token">Token #${escapeHtml(o.daily_order_number)}</span>
                                    <div style="font-weight: 800; margin-top: 6px;">${escapeHtml(o.username)}</div>
                                    <div class="muted">🕒 ${escapeHtml(o.date)} ${escapeHtml(o.time)} · ${escapeHtml(type)}</div>
                                </div>
                                <div style="text-align: right;">
                                    <span class="badge" style="background:${isPrep ? '#fee2e2; color:#b91c1c;' : '#f0e7d1; color:#766d5d;'}">${escapeHtml(o.order_status.toUpperCase())}</span>
                                    <div class="muted" style="margin-top: 6px;">🟢 PAID</div>
                                </div>
                            </div>

                            <div class="click-hint">&#128070; Click card to view items (${o.items ? o.items.length : 0})</div>

                            <div class="total">
                                <span>Total</span>
                                <span>₹${Number(o.total_amount).toFixed(2)}</span>
                            </div>

                            <div class="actions">
                                <button type="button" class="btn-preparing ${isPrep ? 'active' : ''}" onclick="updateStatus(event, ${o.id}, 'preparing')">
                                    🍳 Preparing
                                </button>
                                <button type="button" class="btn-prepared" onclick="updateStatus(event, ${o.id}, 'prepared')">
                                    ✅ Prepared
                                </button>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (err) {
                box.innerHTML = `<div class="status" style="grid-column: 1 / -1;">${escapeHtml(err.message || 'Could not load orders.')}</div>`;
            }
        }

        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
