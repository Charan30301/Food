<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Admin Login</title>
    <style>
        :root {
            --bg: #0b1329;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 2.5rem; border-radius: 14px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        input[type="password"] { width: 100%; padding: 0.8rem; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 1.25rem; outline: none; }
        input[type="password"]:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-login:hover { background: #0369a1; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; }
    </style>

<style id="premium-admin-login-theme">

:root {
    --gold: #b8953f;
    --gold-light: #d8bd70;
    --gold-dark: #927326;
    --cream: #f8f5ec;
    --card: #fffdf7;
    --border: #ded3b8;
    --text: #302a20;
    --muted: #766d5d;
}

html,
body {
    background:
        radial-gradient(
            circle at top,
            #fffdf8 0%,
            #f8f5ec 55%,
            #f1ead9 100%
        ) !important;

    color: var(--text) !important;
}

body {
    padding: 1rem !important;
}

.login-card {
    background: rgba(255,253,247,0.97) !important;
    border: 1px solid var(--border) !important;
    border-radius: 22px !important;

    padding: 2.25rem !important;

    box-shadow:
        0 20px 55px rgba(80,60,25,0.14),
        0 3px 10px rgba(80,60,25,0.06) !important;

    position: relative;
    overflow: hidden;
}

.login-card::before {
    content: "";
    display: block;
    width: 70px;
    height: 70px;
    margin: 0 auto 1.1rem;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold)
        );

    border: 1px solid var(--gold-dark);

    box-shadow:
        0 6px 16px rgba(100,75,25,0.18);
}

.login-card h2 {
    color: var(--text) !important;
    font-size: 1.45rem !important;
    font-weight: 800 !important;
}

.login-card p {
    color: var(--muted) !important;
    line-height: 1.5 !important;
}

input[type="password"] {
    background: #fffaf0 !important;
    color: var(--text) !important;
    border: 1px solid #d9ccb0 !important;
    border-radius: 12px !important;
    padding: 0.9rem !important;
}

input[type="password"]:focus {
    border-color: var(--gold) !important;
    box-shadow: 0 0 0 3px rgba(184,149,63,0.14) !important;
}

.btn-login {
    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold)
        ) !important;

    color: #fffdf7 !important;
    border: 1px solid var(--gold-dark) !important;
    border-radius: 999px !important;

    padding: 0.9rem !important;

    box-shadow:
        0 6px 16px rgba(100,75,25,0.18) !important;
}

.btn-login:hover {
    background:
        linear-gradient(
            135deg,
            #dfc77f,
            #a98532
        ) !important;
}

.error-msg {
    color: #c53d3d !important;
}

@media (max-width: 480px) {
    .login-card {
        padding: 1.6rem !important;
        border-radius: 19px !important;
    }
}

</style>

</head>
<body>
    <div class="login-card">
        <h2>Admin Authentication</h2>
        <p>Enter the security key to access the operations panel</p>
        <form id="adminLoginForm" onsubmit="handleLogin(event)">
            <input type="password" id="adminPassword" placeholder="Admin Password" required autofocus autocomplete="current-password" />
            <button type="submit" class="btn-login">Unlock Admin Panel</button>
        </form>
        <div id="errMsg" class="error-msg"></div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById("adminPassword").value.trim();
            const err = document.getElementById("errMsg");
            err.textContent = "";

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.reload();
                } else {
                    err.textContent = data.error || "Authentication failed";
                }
            } catch (error) {
                err.textContent = "Server communication error";
            }
        }
    </script>
</body>
</html>
