<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hotel Admin Login</title>
    <style>
        :root {
            --gold: #b8953f;
            --gold-light: #d8bd70;
            --gold-dark: #927326;
            --cream: #f8f5ec;
            --card: #fffdf7;
            --border: #ded3b8;
            --text: #302a20;
            --muted: #766d5d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: radial-gradient(circle at top, #fffdf8 0%, #f8f5ec 55%, #f1ead9 100%) !important;
            color: var(--text) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: rgba(255,253,247,0.97) !important;
            border: 1px solid var(--border) !important;
            border-radius: 20px !important;
            padding: 2rem 1.4rem !important;
            box-shadow: 0 20px 55px rgba(80,60,25,0.14), 0 3px 10px rgba(80,60,25,0.06) !important;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card::before {
            content: "🛡️";
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: 1px solid var(--gold-dark);
            box-shadow: 0 6px 16px rgba(100,75,25,0.18);
        }

        .login-card h2 {
            color: var(--text) !important;
            font-size: 1.35rem !important;
            font-weight: 800 !important;
            margin-bottom: 0.35rem;
        }

        .login-card p {
            color: var(--muted) !important;
            line-height: 1.4 !important;
            font-size: 0.85rem;
            margin-bottom: 1.35rem;
        }

        input[type="password"] {
            width: 100%;
            background: #fffaf0 !important;
            color: var(--text) !important;
            border: 1px solid #d9ccb0 !important;
            border-radius: 12px !important;
            padding: 0.85rem !important;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        input[type="password"]:focus {
            border-color: var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(184,149,63,0.14) !important;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold)) !important;
            color: #fffdf7 !important;
            border: 1px solid var(--gold-dark) !important;
            border-radius: 999px !important;
            padding: 0.85rem !important;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(100,75,25,0.18) !important;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #dfc77f, #a98532) !important;
        }

        .error-msg {
            color: #c53d3d !important;
            font-size: 0.85rem;
            margin-top: 0.85rem;
        }
    </style>
<script src="/static/js/pwa.js" defer></script>
</head>
<body>
    <div class="login-card">
        <h2>Admin Authentication</h2>
        <p>Enter the security key to access the operations panel</p>
        <form id="adminLoginForm" onsubmit="handleLogin(event)">
            <input type="password" id="adminPassword" placeholder="Admin Password" required autofocus autocomplete="current-password" />
            <button type="submit" class="btn-login">Unlock Admin Panel</button>
        </form>
        <div id="errMsg" class="error-msg"></div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById("adminPassword").value.trim();
            const err = document.getElementById("errMsg");
            err.textContent = "";

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.reload();
                } else {
                    err.textContent = data.error || "Authentication failed";
                }
            } catch (error) {
                err.textContent = "Server communication error";
            }
        }
    </script>
</body>
</html>
