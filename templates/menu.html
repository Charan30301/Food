<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Palace Hotel - Menu</title>
    <style>
        :root {
            --ivory: #f7f3e8;
            --cream: #eee8d8;
            --gold: #b8953f;
            --gold-dark: #927326;
            --gold-light: #d8bd70;
            --gold-border: #d8c9a4;
            --espresso: #30291f;
            --brown-light: #6e6250;
            --green: #22a878;
            --red: #c94b45;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
        body {
            width: 100%; min-height: 100vh; margin: 0; padding-bottom: 120px;
            background: linear-gradient(135deg, #fbf9f2 0%, #f7f3e8 45%, #eee8d8 100%) !important;
            color: var(--espresso) !important; overflow-x: hidden;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(251, 249, 242, 0.96) !important;
            border-bottom: 1px solid var(--gold-border) !important;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 3px 15px rgba(80, 60, 25, 0.05); padding: 0.85rem 1.5rem;
        }

        .top-bar { display: flex; align-items: center; width: 100%; gap: 10px; }
        .search-container { flex: 1 1 auto; position: relative; }
        .search-input {
            width: 100%; height: 48px; box-sizing: border-box; padding: 0 18px 0 48px;
            font-size: 16px; background: rgba(255, 255, 255, 0.90) !important;
            color: var(--espresso) !important; border: 1px solid var(--gold-border) !important;
            border-radius: 999px !important; outline: none; box-shadow: 0 3px 12px rgba(80, 60, 25, 0.06);
        }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gold-dark); font-size: 19px; }

        .profile-btn {
            flex: 0 0 48px; width: 48px; height: 48px; border-radius: 50% !important;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: linear-gradient(135deg, #d8bd70, #b8953f) !important;
            border: 1px solid #927326 !important; position: relative; font-size: 0 !important;
        }
        .profile-btn::before { content: attr(data-initial); font-size: 20px; font-weight: 800; color: #1c160b; }

        .kitchen-banner {
            display: none; background: #f8e9e5 !important; color: #9c4039 !important;
            border-bottom: 1px solid #dfbdb5; text-align: center; padding: 0.65rem; font-weight: 700; font-size: 0.9rem;
        }
        .kitchen-banner.show { display: block; }

        .categories-container {
            max-width: 1400px; margin: 1.25rem auto 0.5rem; padding: 0 1.5rem;
            display: flex; gap: 0.75rem; overflow-x: auto; scrollbar-width: none;
        }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: rgba(255, 255, 255, 0.75) !important; color: var(--brown-light) !important;
            border: 1px solid var(--gold-border) !important; border-radius: 999px !important;
            padding: 0.6rem 1.4rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, #c5a765, #a88648) !important;
            color: #fffdf7 !important; border-color: var(--gold) !important;
            box-shadow: 0 5px 14px rgba(145, 112, 54, 0.20);
        }

        .menu-list {
            max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem;
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;
        }
        @media (max-width: 1100px) { .menu-list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 768px) {
            .menu-list { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 12px !important; padding: 0 16px !important; }
            .item-text h3 { font-size: 1rem !important; }
            .photo-container { height: 165px !important; }
        }

        .item-card {
            background: rgba(255, 255, 255, 0.94) !important; border: 1px solid var(--gold-border) !important;
            border-radius: 18px !important; overflow: hidden; display: flex; flex-direction: column;
            justify-content: space-between; box-shadow: 0 4px 15px rgba(70, 55, 30, 0.06);
        }
        .photo-container { position: relative; width: 100%; height: 180px; background: var(--cream); }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { position: absolute; top: 10px; left: 10px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fffdf7; }
        .status-dot.active { background-color: var(--green); }
        .status-dot.inactive { background-color: var(--red); }

        .action-ctrl {
            position: absolute; bottom: 10px; right: 10px; background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--gold-border); border-radius: 999px; display: flex; align-items: center;
            box-shadow: 0 4px 12px rgba(60, 45, 20, 0.14);
        }
        .action-btn { background: none; border: none; padding: 0.45rem 0.75rem; font-size: 1rem; cursor: pointer; color: var(--gold-dark); font-weight: 700; }
        .qty-label { font-size: 0.9rem; min-width: 20px; text-align: center; color: var(--espresso); font-weight: 700; }

        .item-info { padding: 0.85rem 1rem; display: flex; justify-content: space-between; align-items: flex-end; background: #fffdf8; }
        .item-text h3 { font-size: 1.05rem; color: var(--espresso); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-category { font-size: 0.8rem; color: var(--brown-light); text-transform: capitalize; }
        .item-price { font-size: 1.15rem; font-weight: 800; color: var(--gold-dark); }

        /* Floating Bars */
        .floating-action-bar {
            position: fixed; bottom: 20px; right: 20px; padding: 0.85rem 1.25rem;
            border-radius: 16px; display: none; align-items: center; gap: 1.25rem; z-index: 900;
            cursor: pointer; text-decoration: none; background: linear-gradient(135deg, #c2a45e, #9e7d3e) !important;
            color: #fffdf6 !important; box-shadow: 0 10px 30px rgba(120, 90, 35, 0.25);
        }
        .floating-action-bar.visible { display: flex; }
        .badge { background: rgba(255, 255, 255, 0.18); padding: 0.35rem 0.75rem; border-radius: 8px; font-weight: 800; }

        .mobile-cart-icon { display: none; }
        @media (max-width: 768px) {
            #cartBar.cart-bar {
                width: 68px !important; height: 68px !important; min-width: 68px !important; min-height: 68px !important;
                padding: 0 !important; border-radius: 50% !important; flex-direction: column !important;
                justify-content: center !important; gap: 2px !important; right: 16px !important; bottom: 16px !important;
            }
            #cartBar .mobile-cart-icon { display: flex !important; font-size: 24px; line-height: 1; }
            #cartBar .cart-text-area { display: none !important; }
            #cartBar #cartTotalLabel { font-size: 0.72rem !important; background: transparent !important; padding: 0 !important; }
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(48, 41, 31, 0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.open { display: flex; }
        .progress-box {
            background: #fbf9f2; border: 1px solid var(--gold-border); border-radius: 20px;
            padding: 2rem; width: 92%; max-width: 540px; text-align: center;
            box-shadow: 0 20px 60px rgba(40, 30, 15, 0.22);
        }

        .stepper-row { display: flex; justify-content: space-between; align-items: center; margin: 2rem 0; position: relative; }
        .stepper-row::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: var(--gold-border); z-index: 1; }
        .step-col { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; flex: 1; }
        .step-dot {
            width: 24px; height: 24px; border-radius: 50%; background: #e4dfd1; border: 3px solid #fbf9f2;
            transition: all 0.3s ease;
        }
        .step-dot.green { background: var(--gold) !important; box-shadow: 0 0 12px rgba(184, 155, 94, 0.5); }
        .step-name { font-size: 0.75rem; color: var(--brown-light); font-weight: 700; text-transform: uppercase; }

        /* Themed Notification Popup */
        .themed-popup-box {
            background: #fffdf7; border: 1px solid var(--gold-border); border-radius: 20px;
            padding: 2rem; width: 90%; max-width: 460px; text-align: center;
            box-shadow: 0 20px 55px rgba(55,43,20,0.25);
        }
        .themed-popup-icon { font-size: 2.8rem; margin-bottom: 0.5rem; }
        .themed-popup-title { color: var(--espresso); font-size: 1.3rem; margin-bottom: 0.6rem; font-weight: 800; }
        .themed-popup-msg { color: var(--brown-light); font-size: 0.95rem; margin-bottom: 1.25rem; line-height: 1.5; }
        .themed-popup-reason {
            background: #fff0ee; border: 1px solid #e7aaa5; color: #721c24;
            padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; line-height: 1.5; font-size: 0.95rem; text-align: left;
        }
        .btn-themed-ack {
            width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #d8bd70, #b8953f);
            color: #fffdf7; border: 1px solid #927326; border-radius: 999px; font-weight: 800; cursor: pointer; font-size: 1rem;
        }

        /* Profile Sidebar */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(48, 41, 31, 0.40); z-index: 1100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        .profile-sidebar {
            position: fixed; top: 0; right: -450px; width: 100%; max-width: 420px; height: 100%;
            background: #fbf9f2; border-left: 1px solid var(--gold-border);
            box-shadow: -12px 0 35px rgba(40, 30, 15, 0.15); z-index: 1200;
            display: flex; flex-direction: column; transition: right 0.35s ease;
        }
        .profile-sidebar.open { right: 0; }
        .sidebar-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gold-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-close-btn { background: none; border: none; font-size: 1.5rem; color: var(--gold-dark); cursor: pointer; }
        .sidebar-body { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

        .profile-card, .order-card {
            background: #fffdf8; border: 1px solid var(--gold-border); border-radius: 14px;
            padding: 1.2rem; box-shadow: 0 3px 12px rgba(70, 55, 30, 0.05);
        }
        .username-input {
            flex: 1; padding: 0.65rem 0.85rem; background: #fff; border: 1px solid var(--gold-border);
            border-radius: 8px; color: var(--espresso); outline: none;
        }
        .save-username-btn {
            background: linear-gradient(135deg, #c2a45e, #9e7d3e); color: #fff;
            border: none; padding: 0.65rem 1rem; border-radius: 8px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="kitchen-banner" id="kitchenClosedBanner">⚠️ The Kitchen is currently CLOSED. Preorders are temporarily paused.</div>

    <header>
        <div class="top-bar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search dishes or items...">
            </div>
            <div class="profile-btn" onclick="openProfileSidebar()" title="{{ email }}" data-initial="{{ username[0]|upper if username else 'A' }}"></div>
        </div>
    </header>

    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('tiffins', this)">Tiffins</button>
        <button class="cat-btn" onclick="filterCategory('fast food', this)">Fast Food</button>
        <button class="cat-btn" onclick="filterCategory('meals', this)">Meals</button>
    </div>

    <main class="menu-list" id="menuContainer"></main>

    <!-- Floating Cart Button (Visible until order is fully PAID) -->
    <a href="/cart" class="floating-action-bar cart-bar" id="cartBar">
        <div class="mobile-cart-icon">🛒</div>
        <div class="cart-text-area">
            <h4 style="font-size:0.95rem;" id="cartBarTitle">View Cart</h4>
            <div style="font-size:0.75rem; color:#fef3c7;" id="cartCodeLabel"></div>
        </div>
        <div class="badge" id="cartTotalLabel">₹0.00</div>
    </a>

    <!-- Floating Order Placed Button (Active ONLY when paid) -->
    <div class="floating-action-bar order-placed-bar" id="orderPlacedBar" onclick="openOrderProgressModal()">
        <div>
            <h4 style="font-size:0.95rem;">Order Placed!</h4>
            <div style="font-size:0.75rem; color:#fef3c7;" id="orderStatusText">Kitchen is preparing your food</div>
        </div>
        <div class="badge">Token #<span id="activeTokenId">0</span></div>
    </div>

    <!-- 4-Stage Stepper Live Progress Modal -->
    <div class="modal-overlay" id="orderProgressModal">
        <div class="progress-box">
            <h3 style="color:var(--gold-dark); font-size:1.35rem; font-weight:800;">Token #<span id="modalOrderId">0</span> Status</h3>
            <p style="color:var(--brown-light); font-size:0.9rem; margin-top:0.3rem;" id="modalPaymentInfo">Payment Verified • Preparing</p>

            <div class="stepper-row">
                <div class="step-col">
                    <div class="step-dot" id="dotAccepted"></div>
                    <span class="step-name">Accepted</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPreparing"></div>
                    <span class="step-name">Preparing</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPrepared"></div>
                    <span class="step-name">Prepared</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotDelivered"></div>
                    <span class="step-name">Delivered</span>
                </div>
            </div>

            <button class="btn-themed-ack" onclick="closeOrderProgressModal()">Close Status</button>
        </div>
    </div>

    <!-- THEMED NOTIFICATION POPUP (Replaces all browser alerts) -->
    <div class="modal-overlay" id="themedPopupModal">
        <div class="themed-popup-box">
            <div class="themed-popup-icon" id="themedPopupIcon">✨</div>
            <h3 class="themed-popup-title" id="themedPopupTitle">Update</h3>
            <p class="themed-popup-msg" id="themedPopupMsg"></p>
            <div class="themed-popup-reason" id="themedPopupReason" style="display:none;"></div>
            <button class="btn-themed-ack" id="themedPopupAckBtn" onclick="closeThemedPopup()">Understood</button>
        </div>
    </div>

    <!-- Profile Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeProfileSidebar()"></div>
    <aside class="profile-sidebar" id="profileSidebar">
        <div class="sidebar-header">
            <h3 style="color:var(--gold-dark);">My Profile</h3>
            <button class="sidebar-close-btn" onclick="closeProfileSidebar()">&times;</button>
        </div>
        <div class="sidebar-body">
            <div class="profile-card">
                <label style="font-size:0.8rem; color:var(--brown-light);">Verified Gmail</label>
                <div style="font-size:0.9rem; color:var(--gold-dark); margin-bottom:0.75rem;">{{ email }}</div>

                <label style="font-size:0.8rem; color:var(--brown-light);">Display Name</label>
                <div style="display:flex; gap:0.5rem; margin-top:0.4rem;">
                    <input type="text" id="profileUsernameInput" class="username-input" value="{{ username }}">
                    <button class="save-username-btn" onclick="saveNewUsername()">Save</button>
                </div>
            </div>

            <div>
                <h4 style="margin-bottom:0.75rem; color:var(--espresso);">Past Orders</h4>
                <div id="ordersHistoryList" style="display:flex; flex-direction:column; gap:0.75rem;"></div>
            </div>

            <a href="/logout" style="margin-top:auto; padding:0.8rem; background:rgba(201,75,69,0.1); color:#c94b45; text-align:center; border-radius:8px; text-decoration:none; font-weight:700;">Log Out</a>
        </div>
    </aside>

    <script>
        let menuItems = [];
        let cartData = {};
        let currentCategory = 'all';
        let searchQuery = '';
        let activeOrder = null;
        let localMenuVersion = null;
        let lastReportedStatus = null;
        let popupOnCloseCallback = null;

        // Custom Themed Popup Function
        function showThemedPopup({ title, message, icon="✨", reason=null, btnText="Understood", onClose=null }) {
            document.getElementById("themedPopupTitle").textContent = title;
            document.getElementById("themedPopupMsg").textContent = message;
            document.getElementById("themedPopupIcon").textContent = icon;
            document.getElementById("themedPopupAckBtn").textContent = btnText;

            const reasonEl = document.getElementById("themedPopupReason");
            if (reason) {
                reasonEl.innerHTML = `<strong>Reason:</strong> ${reason}`;
                reasonEl.style.display = "block";
            } else {
                reasonEl.style.display = "none";
            }

            popupOnCloseCallback = onClose;
            document.getElementById("themedPopupModal").classList.add("open");
        }

        function closeThemedPopup() {
            document.getElementById("themedPopupModal").classList.remove("open");
            if (popupOnCloseCallback) {
                popupOnCloseCallback();
                popupOnCloseCallback = null;
            }
        }

        // Live Polling
        async function checkOrderStatus() {
            try {
                const res = await fetch('/api/order/active');
                const data = await res.json();
                const orderPlacedBar = document.getElementById('orderPlacedBar');
                const cartBar = document.getElementById('cartBar');

                // Kitchen toggle banner
                const closedBanner = document.getElementById('kitchenClosedBanner');
                if (!data.kitchen_open) closedBanner.classList.add('show');
                else closedBanner.classList.remove('show');

                // Auto live menu reload on sync
                if (localMenuVersion !== null && data.menu_version && data.menu_version !== localMenuVersion) {
                    localMenuVersion = data.menu_version;
                    loadMenuAndCart();
                } else if (localMenuVersion === null && data.menu_version) {
                    localMenuVersion = data.menu_version;
                }

                // 1. CANCELLATION POPUP (With reason)
                if (data.alert && data.status === 'cancelled') {
                    showThemedPopup({
                        title: "Order Cancelled by Kitchen",
                        message: "The restaurant was unable to prepare your order.",
                        icon: "❌",
                        reason: data.reason || "Kitchen is busy, please try again in a few minutes.",
                        btnText: "Understood",
                        onClose: async () => {
                            try {
                                await fetch('/api/order/ack-alert', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ order_id: data.order_id })
                                });
                            } catch (e) {}
                        }
                    });

                    activeOrder = null;
                    lastReportedStatus = null;
                    orderPlacedBar.classList.remove('visible');
                    loadMenuAndCart();
                    return;
                }

                // 2. DELIVERED POPUP
                if (data.alert && data.status === 'delivered') {
                    showThemedPopup({
                        title: "Order Delivered!",
                        message: `Your food (Token #${data.daily_order_number || data.order_id}) has been delivered! Enjoy your meal.`,
                        icon: "🎉",
                        btnText: "Awesome!",
                        onClose: async () => {
                            try {
                                await fetch('/api/order/ack-alert', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ order_id: data.order_id })
                                });
                            } catch (e) {}
                        }
                    });

                    activeOrder = null;
                    lastReportedStatus = null;
                    orderPlacedBar.classList.remove('visible');
                    loadMenuAndCart();
                    return;
                }

                // 3. ACTIVE ORDER TRANSITIONS (Popups for accept, preparing, prepared)
                if (data.has_active_order) {
                    activeOrder = data;

                    // POPUPS FOR EVERY STATUS UPDATE
                    if (lastReportedStatus && lastReportedStatus !== data.status) {
                        if (data.status === 'accepted') {
                            showThemedPopup({
                                title: "Order Accepted by Kitchen!",
                                message: `Chef accepted Token #${data.daily_order_number}. ${data.payment_status === 'paid' ? 'Cooking starting soon!' : 'Please complete payment via cart.'}`,
                                icon: "👨‍🍳",
                                btnText: "Great!"
                            });
                        } else if (data.status === 'preparing') {
                            showThemedPopup({
                                title: "Food is Preparing!",
                                message: `The kitchen is now actively preparing Token #${data.daily_order_number}!`,
                                icon: "🍳",
                                btnText: "Got it"
                            });
                        } else if (data.status === 'prepared') {
                            showThemedPopup({
                                title: "Food Ready!",
                                message: `Token #${data.daily_order_number} is prepared and ready for delivery/pickup!`,
                                icon: "🍽️",
                                btnText: "Ready"
                            });
                        }
                    }
                    lastReportedStatus = data.status;

                    // Strict Button Switch
                    if (data.payment_status === 'paid') {
                        cartBar.classList.remove('visible');
                        orderPlacedBar.classList.add('visible');
                        document.getElementById('activeTokenId').textContent = data.daily_order_number;

                        const statusMap = {
                            'accepted': 'Order Accepted by Chef',
                            'preparing': 'Kitchen is preparing your food',
                            'prepared': 'Food is Prepared & Ready!'
                        };
                        document.getElementById('orderStatusText').textContent = statusMap[data.status] || data.status.toUpperCase();
                        updateStepperDots(data.status);
                    } else {
                        orderPlacedBar.classList.remove('visible');
                        cartBar.classList.add('visible');

                        if (data.status === 'placed') {
                            const secs = data.seconds_left !== undefined ? data.seconds_left : 60;
                            document.getElementById('cartBarTitle').textContent = `Awaiting Kitchen (${secs}s)`;
                        } else {
                            document.getElementById('cartBarTitle').textContent = "Pay Now (Accepted)";
                        }
                    }
                } else {
                    orderPlacedBar.classList.remove('visible');
                    activeOrder = null;
                    document.getElementById('cartBarTitle').textContent = "View Cart";
                    updateCartUI(cartCodeCached, cartTotalCached);
                }
            } catch (err) {}
        }

        function openOrderProgressModal() {
            if (!activeOrder) return;
            document.getElementById('modalOrderId').textContent = activeOrder.daily_order_number;
            updateStepperDots(activeOrder.status);
            document.getElementById('orderProgressModal').classList.add('open');
        }
        function closeOrderProgressModal() { document.getElementById('orderProgressModal').classList.remove('open'); }

        function updateStepperDots(status) {
            const stages = ['accepted', 'preparing', 'prepared', 'delivered'];
            const currentIndex = stages.indexOf(status);

            const dots = [
                document.getElementById('dotAccepted'),
                document.getElementById('dotPreparing'),
                document.getElementById('dotPrepared'),
                document.getElementById('dotDelivered')
            ];

            dots.forEach((dot, idx) => {
                if (idx <= currentIndex) {
                    dot.classList.add('green');
                } else {
                    dot.classList.remove('green');
                }
            });
        }

        let cartCodeCached = "";
        let cartTotalCached = 0.0;

        async function loadMenuAndCart() {
            try {
                const res = await fetch('/api/menu');
                const data = await res.json();
                menuItems = data.items || [];
                cartData = data.cart || {};
                localMenuVersion = data.menu_version;
                cartCodeCached = data.cart_code || '';
                cartTotalCached = data.total_price || 0.0;
                updateCartUI(cartCodeCached, cartTotalCached);
                renderMenu();
            } catch (err) {}
        }

        function filterCategory(category, buttonEl) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonEl.classList.add('active');
            renderMenu();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderMenu();
        });

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            const filtered = menuItems.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category.toLowerCase() === currentCategory.toLowerCase();
                const matchesSearch = item.item_name.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(item => {
                const qty = cartData[item.id] !== undefined ? cartData[item.id] : (cartData[String(item.id)] || 0);
                const card = document.createElement('div');
                card.className = 'item-card';

                let actionHtml = '';
                if (item.is_active) {
                    if (qty === 0) {
                        actionHtml = `<div class="action-ctrl"><button class="action-btn" onclick="updateItemQuantity(${item.id}, 1)">+</button></div>`;
                    } else {
                        actionHtml = `
                            <div class="action-ctrl">
                                <button class="action-btn" onclick="updateItemQuantity(${item.id}, -1)">−</button>
                                <span class="qty-label">${qty}</span>
                                <button class="action-btn" onclick="updateItemQuantity(${item.id}, 1)">+</button>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="photo-container">
                        <img src="${item.photo_url || 'https://via.placeholder.com/600x400'}" alt="${item.item_name}">
                        <span class="status-dot ${item.is_active ? 'active' : 'inactive'}"></span>
                        ${actionHtml}
                    </div>
                    <div class="item-info">
                        <div class="item-text">
                            <h3>${item.item_name}</h3>
                            <div class="item-category">${item.category}</div>
                        </div>
                        <div class="item-price">₹${Number(item.price).toFixed(2)}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateItemQuantity(itemId, delta) {
            try {
                const res = await fetch('/api/cart/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId, delta })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    cartData = data.cart;
                    cartCodeCached = data.cart_code;
                    cartTotalCached = data.total_price;
                    updateCartUI(data.cart_code, data.total_price);
                    renderMenu();
                }
            } catch (err) {}
        }

        function updateCartUI(cartCode, totalPrice) {
            const cartBar = document.getElementById('cartBar');
            const orderPlacedBar = document.getElementById('orderPlacedBar');
            if (orderPlacedBar.classList.contains('visible')) {
                cartBar.classList.remove('visible');
                return;
            }
            const hasItems = Object.values(cartData || {}).some(qty => Number(qty) > 0);
            if (hasItems) {
                cartBar.classList.add('visible');
                document.getElementById('cartCodeLabel').textContent = cartCode || '';
                document.getElementById('cartTotalLabel').textContent = `₹${Number(totalPrice || 0).toFixed(2)}`;
            } else {
                cartBar.classList.remove('visible');
            }
        }

        function openProfileSidebar() {
            document.getElementById('profileSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            fetchOrderHistory();
        }
        function closeProfileSidebar() {
            document.getElementById('profileSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        async function saveNewUsername() {
            const newName = document.getElementById('profileUsernameInput').value.trim();
            if (!newName) return;
            const res = await fetch('/api/profile/update-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: newName })
            });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            }
        }

        async function fetchOrderHistory() {
            const listEl = document.getElementById('ordersHistoryList');
            listEl.innerHTML = '<div style="color:var(--brown-light); padding:1rem;">Loading...</div>';
            const res = await fetch('/api/profile/orders');
            const data = await res.json();
            if (!data.orders || data.orders.length === 0) {
                listEl.innerHTML = '<div style="color:var(--brown-light); padding:1rem;">No past orders.</div>';
                return;
            }
            listEl.innerHTML = '';
            data.orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <strong>Token #${order.daily_order_number}</strong>
                        <span style="font-weight:700; text-transform:uppercase; font-size:0.8rem;">${order.order_status}</span>
                    </div>
                    <div style="font-size:0.85rem; color:var(--brown-light); margin:0.4rem 0;">${order.items.join(', ')}</div>
                    ${order.cancellation_reason ? `<div style="color:#c94b45; font-size:0.8rem;">Reason: ${order.cancellation_reason}</div>` : ''}
                    <div style="display:flex; justify-content:space-between; font-weight:800; color:var(--gold-dark); margin-top:0.3rem;">
                        <span>Total (${order.payment_status.toUpperCase()})</span>
                        <span>₹${order.total_amount.toFixed(2)}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        async function init() {
            await loadMenuAndCart();
            await checkOrderStatus();
            setInterval(checkOrderStatus, 2000);
        }
        init();
    </script>
</body>
</html>
