<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Palace Hotel - Menu</title>
    <style>
        :root {
            --bg: #0b1329;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0284c7;
            --success: #10b981;
            --danger: #ef4444;
            --amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--card-border); padding: 1rem 1.5rem;
        }

        .top-bar { display: flex; align-items: center; gap: 1rem; max-width: 1400px; margin: 0 auto; }
        .search-container { flex: 1; position: relative; }
        .search-input {
            width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 9999px; color: #fff; font-size: 0.95rem; outline: none;
        }
        .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .profile-btn {
            display: flex; align-items: center; gap: 0.5rem; background: var(--card-bg);
            border: 1px solid var(--card-border); padding: 0.5rem 1rem; border-radius: 9999px;
            color: var(--text-main); font-size: 0.9rem; cursor: pointer; transition: 0.2s;
        }
        .profile-btn:hover { border-color: var(--primary); background: #253348; }

        .categories-container {
            max-width: 1400px; margin: 1.25rem auto 0.5rem; padding: 0 1.5rem;
            display: flex; gap: 0.75rem; overflow-x: auto;
        }

        .cat-btn {
            background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border);
            padding: 0.6rem 1.4rem; border-radius: 9999px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; text-transform: capitalize; white-space: nowrap;
        }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .menu-list {
            max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem;
        }

        @media (max-width: 768px) {
            .menu-list { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding: 0 0.75rem; }
            .photo-container { height: 140px !important; }
        }

        .item-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .photo-container { position: relative; width: 100%; height: 180px; background: #000; }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }

        .status-dot {
            position: absolute; top: 10px; left: 10px; width: 12px; height: 12px;
            border-radius: 50%; border: 2px solid #fff; z-index: 2;
        }
        .status-dot.active { background-color: var(--success); }
        .status-dot.inactive { background-color: var(--danger); }

        .action-ctrl {
            position: absolute; bottom: 10px; right: 10px; background: #ffffff;
            border-radius: 9999px; display: flex; align-items: center; z-index: 2;
        }
        .action-btn { background: none; border: none; padding: 0.45rem 0.75rem; font-size: 1rem; cursor: pointer; color: #0f172a; }
        .qty-label { font-size: 0.9rem; min-width: 20px; text-align: center; color: #0f172a; font-weight: bold; }

        .item-info { padding: 0.85rem 1rem; display: flex; justify-content: space-between; align-items: flex-end; }
        .item-text h3 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-category { font-size: 0.8rem; color: var(--text-muted); text-transform: capitalize; }
        .item-price { font-size: 1.15rem; font-weight: 700; color: #38bdf8; }

        /* Floating Bars */
        .floating-action-bar {
            position: fixed; bottom: 20px; right: 20px; padding: 0.85rem 1.25rem;
            border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none;
            align-items: center; gap: 1.25rem; z-index: 900; cursor: pointer; text-decoration: none;
        }
        .floating-action-bar.visible { display: flex; }
        .cart-bar { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; }
        
        /* Floating Order Bar Colors */
        .order-placed-bar { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
        .order-unpaid-bar { background: linear-gradient(135deg, #ef4444, #b91c1c) !important; color: #fff; }

        .badge { font-size: 1.1rem; font-weight: 800; background: rgba(255,255,255,0.2); padding: 0.35rem 0.75rem; border-radius: 8px; }

        /* Step Progress Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1500;
        }
        .modal-overlay.open { display: flex; }
        .progress-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 2rem; width: 92%; max-width: 550px; text-align: center;
        }

        .stepper-row { display: flex; justify-content: space-between; align-items: center; margin: 2rem 0; position: relative; }
        .stepper-row::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #334155; z-index: 1; }
        .step-col { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; flex: 1; }
        .step-dot { width: 24px; height: 24px; border-radius: 50%; background: #334155; border: 3px solid #0f172a; transition: 0.3s; }
        .step-dot.green { background: var(--success); box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
        .step-name { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .step-name.active { color: #fff; }

        /* Slide-out Sidebar */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); z-index: 1100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        .profile-sidebar { position: fixed; top: 0; right: -450px; width: 100%; max-width: 420px; height: 100%; background: #0f172a; border-left: 1px solid var(--card-border); box-shadow: -10px 0 25px rgba(0, 0, 0, 0.7); z-index: 1200; display: flex; flex-direction: column; transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .profile-sidebar.open { right: 0; }
        .sidebar-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .sidebar-body { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

        .profile-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.25rem; }
        .username-input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .username-input { flex: 1; padding: 0.65rem 0.85rem; background: #0b1329; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; outline: none; }
        .save-username-btn { background: var(--primary); color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .orders-list { display: flex; flex-direction: column; gap: 0.85rem; }
        .order-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .order-status-pill { padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .pill-placed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .pill-accepted { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }
        .pill-preparing { background: rgba(234, 88, 12, 0.2); color: #fb923c; }
        .pill-prepared { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .pill-delivered { background: rgba(16, 185, 129, 0.4); color: #10b981; }
        .pill-cancelled { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search dishes or items...">
            </div>
            <div class="profile-btn" onclick="openProfileSidebar()" title="{{ email }}">
                <span>👤</span>
                <span id="navUsernameDisplay">{{ username }}</span>
            </div>
        </div>
    </header>

    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('tiffins', this)">Tiffins</button>
        <button class="cat-btn" onclick="filterCategory('fast food', this)">Fast Food</button>
        <button class="cat-btn" onclick="filterCategory('meals', this)">Meals</button>
    </div>

    <main class="menu-list" id="menuContainer"></main>

    <!-- State 1: Active Cart -->
    <a href="/cart" class="floating-action-bar cart-bar" id="cartBar">
        <div>
            <h4 style="font-size:0.95rem;">View Cart</h4>
            <div style="font-size:0.75rem; color:#bae6fd;" id="cartCodeLabel"></div>
        </div>
        <div class="badge" id="cartTotalLabel">₹0.00</div>
    </a>

    <!-- State 2: Order Placed Button (Shows Token # and turns red if payment pending) -->
    <div class="floating-action-bar order-placed-bar" id="orderPlacedBar" onclick="openOrderProgressModal()">
        <div>
            <h4 style="font-size:0.95rem;" id="orderBarTitle">Order Placed</h4>
            <div style="font-size:0.75rem; color:#fef3c7;" id="orderStatusText">Tap to track status</div>
        </div>
        <div class="badge">Token #<span id="activeTokenId">0</span></div>
    </div>

    <!-- 4-Stage Progress Tracker Modal -->
    <div class="modal-overlay" id="orderProgressModal">
        <div class="progress-box">
            <h3>Token #<span id="modalOrderId">0</span> Status</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.3rem;" id="modalPaymentInfo"></p>

            <div class="stepper-row">
                <div class="step-col">
                    <div class="step-dot" id="dotAccepted"></div>
                    <span class="step-name" id="labelAccepted">Accepted</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPreparing"></div>
                    <span class="step-name" id="labelPreparing">Preparing</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPrepared"></div>
                    <span class="step-name" id="labelPrepared">Prepared</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotDelivered"></div>
                    <span class="step-name" id="labelDelivered">Delivered</span>
                </div>
            </div>

            <button class="save-username-btn" onclick="closeOrderProgressModal()" style="width:100%;">Close Status</button>
        </div>
    </div>

    <!-- Profile Drawer & Orders History -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeProfileSidebar()"></div>
    <aside class="profile-sidebar" id="profileSidebar">
        <div class="sidebar-header">
            <h3>My Profile</h3>
            <button class="sidebar-close-btn" onclick="closeProfileSidebar()">&times;</button>
        </div>
        <div class="sidebar-body">
            <div class="profile-card">
                <label style="font-size:0.8rem; color:var(--text-muted);">Verified Gmail</label>
                <div style="font-size:0.9rem; color:#38bdf8; margin-bottom:0.75rem;">{{ email }}</div>

                <label style="font-size:0.8rem; color:var(--text-muted);">Display Name</label>
                <div class="username-input-row">
                    <input type="text" id="profileUsernameInput" class="username-input" value="{{ username }}">
                    <button class="save-username-btn" onclick="saveNewUsername()">Save</button>
                </div>
                <div id="usernameStatusMsg" style="font-size:0.8rem; margin-top:0.4rem;"></div>
            </div>

            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                    <h4>All Orders History</h4>
                    <button onclick="fetchOrderHistory()" style="background:none; border:none; color:var(--primary); font-size:0.85rem; cursor:pointer;">Refresh</button>
                </div>
                <div class="orders-list" id="ordersHistoryList"></div>
            </div>

            <a href="/logout" style="margin-top:auto; padding:0.8rem; background:rgba(239, 68, 68, 0.15); color:#ef4444; text-align:center; border-radius:8px; text-decoration:none; font-weight:600;">Log Out</a>
        </div>
    </aside>

    <script>
        let menuItems = [];
        let cartData = {};
        let currentCategory = 'all';
        let searchQuery = '';
        let activeOrder = null;

let lastReportedStatus = null;

async function checkOrderStatus() {
    try {
        const res = await fetch('/api/order/active');
        const data = await res.json();
        const bar = document.getElementById('orderPlacedBar');
        const cartBar = document.getElementById('cartBar');

        // 1. TERMINAL ALERTS (Cancelled or Delivered)
        if (data.alert) {
            if (data.status === 'cancelled') {
                alert(`⚠️ Order Notice:\n${data.reason}`);
            } else if (data.status === 'delivered') {
                alert(`🎉 Your Order #${data.order_id} has been delivered! Enjoy your meal.`);
            }
            activeOrder = null;
            lastReportedStatus = null;
            bar.classList.remove('visible');
            closeOrderProgressModal();
            loadMenuAndCart();
            return;
        }

        // 2. ACTIVE PROGRESS ALERTS (Placed -> Accepted -> Preparing -> Prepared)
        if (data.has_active_order) {
            activeOrder = data;
            bar.classList.add('visible');
            if (cartBar) cartBar.classList.remove('visible');

            document.getElementById('activeTokenId').textContent = data.daily_order_number;

            // Trigger alert whenever the kitchen updates the status
            if (lastReportedStatus && lastReportedStatus !== data.status) {
                alert(`🔔 Kitchen Update: Token #${data.daily_order_number} is now ${data.status.toUpperCase()}!`);
            }
            lastReportedStatus = data.status;

            if (data.payment_status !== 'paid') {
                bar.classList.add('order-unpaid-bar');
                document.getElementById('orderBarTitle').textContent = "Payment Not Done!";
                document.getElementById('orderStatusText').textContent = "Tap to view status & pay";
            } else {
                bar.classList.remove('order-unpaid-bar');
                document.getElementById('orderBarTitle').textContent = "Order Placed";
                document.getElementById('orderStatusText').textContent = `Status: ${data.status.toUpperCase()}`;
            }

            updateStepperDots(data.status);
        } else {
            bar.classList.remove('visible');
            activeOrder = null;
            lastReportedStatus = null;
        }
    } catch (err) {
        console.error("Status check error:", err);
    }
}

        function openOrderProgressModal() {
            if (!activeOrder) return;
            document.getElementById('modalOrderId').textContent = activeOrder.daily_order_number;
            document.getElementById('modalPaymentInfo').textContent = activeOrder.payment_status === 'paid' ? 'Payment Status: PAID' : 'Payment Status: PAYMENT PENDING';
            updateStepperDots(activeOrder.status);
            document.getElementById('orderProgressModal').classList.add('open');
        }

        function closeOrderProgressModal() {
            document.getElementById('orderProgressModal').classList.remove('open');
        }

        function updateStepperDots(status) {
            const stages = ['accepted', 'preparing', 'prepared', 'delivered'];
            const currentIndex = stages.indexOf(status);

            const dotMap = {
                'accepted': document.getElementById('dotAccepted'),
                'preparing': document.getElementById('dotPreparing'),
                'prepared': document.getElementById('dotPrepared'),
                'delivered': document.getElementById('dotDelivered')
            };

            stages.forEach((st, idx) => {
                if (idx <= currentIndex) {
                    dotMap[st].classList.add('green');
                } else {
                    dotMap[st].classList.remove('green');
                }
            });
        }

        async function init() {
            await checkOrderStatus();
            await loadMenuAndCart();
            setInterval(checkOrderStatus, 4000);
        }

        async function loadMenuAndCart() {
            const res = await fetch('/api/menu');
            const data = await res.json();
            menuItems = data.items;
            cartData = data.cart || {};
            updateCartUI(data.cart_code, data.total_price);
            renderMenu();
        }

        function filterCategory(category, buttonEl) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonEl.classList.add('active');
            renderMenu();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderMenu();
        });

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            const filtered = menuItems.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category.toLowerCase() === currentCategory.toLowerCase();
                const matchesSearch = item.item_name.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(item => {
                const qty = cartData[item.id] || 0;
                const card = document.createElement('div');
                card.className = 'item-card';

                let actionHtml = '';
                if (item.is_active) {
                    if (qty === 0) {
                        actionHtml = `<div class="action-ctrl"><button class="action-btn" onclick="updateItemQuantity(${item.id}, 1)">+</button></div>`;
                    } else {
                        actionHtml = `
                            <div class="action-ctrl">
                                <button class="action-btn" onclick="updateItemQuantity(${item.id}, -1)">−</button>
                                <span class="qty-label">${qty}</span>
                                <button class="action-btn" onclick="updateItemQuantity(${item.id}, 1)">+</button>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="photo-container">
                        <img src="${item.photo_url || 'https://via.placeholder.com/600x400'}" alt="${item.item_name}">
                        <span class="status-dot ${item.is_active ? 'active' : 'inactive'}"></span>
                        ${actionHtml}
                    </div>
                    <div class="item-info">
                        <div class="item-text">
                            <h3>${item.item_name}</h3>
                            <div class="item-category">${item.category}</div>
                        </div>
                        <div class="item-price">₹${item.price.toFixed(2)}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateItemQuantity(itemId, delta) {
            const res = await fetch('/api/cart/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId, delta })
            });
            const data = await res.json();
            if (data.success) {
                cartData = data.cart;
                updateCartUI(data.cart_code, data.total_price);
                renderMenu();
            }
        }

        function updateCartUI(cartCode, totalPrice) {
            const cartBar = document.getElementById('cartBar');
            const orderPlacedBar = document.getElementById('orderPlacedBar');

            if (orderPlacedBar.classList.contains('visible')) {
                cartBar.classList.remove('visible');
                return;
            }

            if (Object.keys(cartData).length > 0) {
                cartBar.classList.add('visible');
                document.getElementById('cartCodeLabel').textContent = cartCode;
                document.getElementById('cartTotalLabel').textContent = `₹${totalPrice.toFixed(2)}`;
            } else {
                cartBar.classList.remove('visible');
            }
        }

        function openProfileSidebar() {
            document.getElementById('profileSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            fetchOrderHistory();
        }

        function closeProfileSidebar() {
            document.getElementById('profileSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        async function saveNewUsername() {
            const newName = document.getElementById('profileUsernameInput').value.trim();
            if (!newName) return;
            const res = await fetch('/api/profile/update-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: newName })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('navUsernameDisplay').textContent = data.username;
            }
        }

        async function fetchOrderHistory() {
            const listEl = document.getElementById('ordersHistoryList');
            listEl.innerHTML = '<div style="color:var(--text-muted); padding:1rem;">Loading...</div>';
            const res = await fetch('/api/profile/orders');
            const data = await res.json();

            if (!data.orders || data.orders.length === 0) {
                listEl.innerHTML = '<div style="color:var(--text-muted); padding:1rem;">No past orders.</div>';
                return;
            }

            listEl.innerHTML = '';
            data.orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                const itemsHtml = order.items.map(i => `<div>• ${i}</div>`).join('');
                const reasonHtml = order.cancellation_reason ? `<div style="color:#fca5a5; font-size:0.8rem;">Reason: ${order.cancellation_reason}</div>` : '';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>Token #${order.daily_order_number}</strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">${order.date} at ${order.time}</div>
                        </div>
                        <span class="order-status-pill pill-${order.order_status}">${order.order_status}</span>
                    </div>
                    <div style="font-size:0.85rem; color:#cbd5e1; border-top:1px dashed var(--card-border); padding-top:0.4rem;">${itemsHtml}</div>
                    ${reasonHtml}
                    <div style="display:flex; justify-content:space-between; font-weight:700; margin-top:0.3rem;">
                        <span>Total (Payment: ${order.payment_status.toUpperCase()})</span>
                        <span style="color:#38bdf8;">₹${order.total_amount.toFixed(2)}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
