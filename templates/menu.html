<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grand Palace Hotel - Menu</title>
    <meta name="theme-color" content="#b8953f">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">

    <style>
        :root {
            --ivory: #f7f3e8;
            --ivory-light: #fbf9f2;
            --cream: #eee8d8;
            --cream-dark: #e3dbc8;
            --gold: #b89b5e;
            --gold-dark: #927326;
            --gold-light: #d8bd70;
            --gold-soft: #eadfbe;
            --gold-border: #d8c9a4;
            --espresso: #30291f;
            --brown: #4a4032;
            --brown-light: #6e6250;
            --white: #ffffff;
            --green: #10b981;
            --red: #ef4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
            background: linear-gradient(135deg, #fbf9f2 0%, #f7f3e8 45%, #eee8d8 100%);
            color: var(--espresso);
        }

        /* PWA Floating Install Button (Top Bar) */
        .btn-install {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 1001;
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            background: var(--gold);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            transition: opacity 0.2s ease;
        }

        .btn-install:active { opacity: 0.85; }

        /* Header & Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(251, 249, 242, 0.94);
            border-bottom: 1px solid var(--gold-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: max(0.6rem, env(safe-area-inset-top)) 1rem 0.6rem;
            width: 100%;
        }

        .top-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 10px;
        }

        .search-container {
            flex: 1 1 auto;
            position: relative;
            min-width: 0;
        }

        .search-input {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 42px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            color: var(--espresso);
            border: 1px solid var(--gold-border);
            border-radius: 999px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184, 155, 94, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-dark);
            font-size: 16px;
            pointer-events: none;
        }

        .profile-btn {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: linear-gradient(135deg, #d8bd70, #b8953f);
            border: 1px solid #927326;
            position: relative;
            box-shadow: 0 3px 10px rgba(80, 60, 25, 0.18);
        }

        .profile-btn::before {
            content: attr(data-initial);
            position: absolute;
            font-size: 1.1rem;
            font-weight: 800;
            color: #1c160b;
        }

        .kitchen-banner {
            display: none;
            background: #f8e9e5;
            color: #9c4039;
            border-bottom: 1px solid #dfbdb5;
            text-align: center;
            padding: 0.6rem 1rem;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .kitchen-banner.show { display: block; }

        /* Categories */
        .categories-container {
            width: 100%;
            max-width: 1400px;
            margin: 0.85rem auto 0.25rem;
            padding: 0 1rem;
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories-container::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.75);
            color: var(--brown-light);
            border: 1px solid var(--gold-border);
            border-radius: 999px;
            padding: 0.5rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            text-transform: capitalize;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, #c5a765, #a88648);
            color: #fffdf7;
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(145, 112, 54, 0.2);
        }

        /* Menu Grid */
        .menu-list {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        @media (max-width: 1100px) {
            .menu-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        }

        @media (max-width: 768px) {
            .menu-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding: 0 10px;
            }
        }

        .item-card {
            background: rgba(255, 255, 255, 0.94);
            color: var(--espresso);
            border: 1px solid var(--gold-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(70, 55, 30, 0.06);
            transition: transform 0.2s ease;
        }

        .photo-container {
            position: relative;
            width: 100%;
            height: 160px;
            background: var(--cream);
            cursor: pointer;
        }

        @media (max-width: 768px) { .photo-container { height: 135px; } }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .status-dot {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid #fffdf7;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .status-dot.active { background-color: var(--green); }
        .status-dot.inactive { background-color: var(--red); }

        .action-ctrl {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--gold-border);
            border-radius: 999px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 10px rgba(60, 45, 20, 0.15);
            z-index: 5;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 0.4rem 0.65rem;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--gold-dark);
            font-weight: 700;
        }

        .qty-label {
            font-size: 0.85rem;
            min-width: 18px;
            text-align: center;
            color: var(--espresso);
            font-weight: 700;
        }

        .item-info {
            padding: 0.75rem 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: #fffdf8;
            cursor: pointer;
            gap: 6px;
        }

        .item-text { flex: 1 1 0; min-width: 0; overflow: hidden; }
        .item-text h3 {
            font-size: 0.95rem;
            color: var(--espresso);
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-category { font-size: 0.75rem; color: var(--brown-light); text-transform: capitalize; }
        .item-price { font-size: 1.05rem; font-weight: 800; color: var(--gold-dark); white-space: nowrap; flex-shrink: 0; }

        /* Floating Action Bars */
        .floating-action-bar {
            position: fixed;
            bottom: max(20px, calc(16px + env(safe-area-inset-bottom)));
            right: max(20px, calc(16px + env(safe-area-inset-right)));
            padding: 0.85rem 1.25rem;
            border-radius: 16px;
            display: none;
            align-items: center;
            gap: 1.25rem;
            z-index: 900;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(120, 90, 35, 0.25);
            transition: all 0.25s ease;
        }

        .floating-action-bar.visible { display: flex; }

        .cart-bar {
            background: linear-gradient(135deg, #c2a45e, #9e7d3e);
            color: #fffdf6;
        }

        .cart-bar.cart-bar-unpaid {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45);
            animation: pulse-red-cart 1.5s infinite alternate;
        }

        @keyframes pulse-red-cart {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .order-placed-bar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
            cursor: pointer;
        }

        .badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 0.3rem 0.65rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            #cartBar.cart-bar {
                width: 58px;
                height: 58px;
                min-width: 58px;
                min-height: 58px;
                padding: 0;
                border-radius: 50%;
                flex-direction: column;
                justify-content: center;
                gap: 1px;
            }
            #cartBar .mobile-cart-icon { font-size: 20px; line-height: 1; }
            #cartBar .cart-text-area { display: none; }
            #cartBar #cartTotalLabel { font-size: 0.68rem; background: transparent; padding: 0; }
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(48, 41, 31, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            padding: 16px;
        }

        .modal-overlay.open { display: flex; }

        .progress-box, .themed-popup-box {
            background: #fffdf7;
            border: 1px solid var(--gold-border);
            border-radius: 20px;
            padding: 1.5rem;
            width: min(92vw, 420px);
            max-height: 85dvh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(55, 43, 20, 0.25);
        }

        .stepper-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .stepper-row::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: var(--gold-border);
            z-index: 1;
        }

        .step-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            flex: 1;
        }

        .step-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #e4dfd1;
            border: 3px solid #fffdf7;
            transition: all 0.3s ease;
        }

        .step-dot.green {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
            border-color: #ffffff;
        }

        .step-name { font-size: 0.7rem; color: var(--brown-light); font-weight: 700; text-transform: uppercase; }

        .themed-popup-icon { font-size: 2.2rem; margin-bottom: 0.4rem; }
        .themed-popup-title { color: var(--espresso); font-size: 1.2rem; margin-bottom: 0.4rem; font-weight: 800; }
        .themed-popup-msg { color: var(--brown-light); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.45; }
        .themed-popup-reason {
            background: #fff0ee;
            border: 1px solid #e7aaa5;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            line-height: 1.4;
            font-size: 0.85rem;
            text-align: left;
        }

        .btn-themed-ack {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #d8bd70, #b8953f);
            color: #fffdf7;
            border: 1px solid #927326;
            border-radius: 999px;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.92rem;
            box-shadow: 0 3px 10px rgba(184, 149, 63, 0.25);
        }

        /* Sidebar Profile */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(48, 41, 31, 0.45);
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .profile-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: min(88vw, 380px);
            height: 100%;
            height: 100dvh;
            background: #fbf9f2;
            border-left: 1px solid var(--gold-border);
            box-shadow: -10px 0 30px rgba(40, 30, 15, 0.15);
            z-index: 1200;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-sidebar.open { right: 0; }

        .sidebar-header {
            padding: max(1rem, env(safe-area-inset-top)) 1.25rem 1rem;
            border-bottom: 1px solid var(--gold-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-close-btn { background: none; border: none; font-size: 1.6rem; color: var(--gold-dark); cursor: pointer; }

        .sidebar-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-footer {
            padding: 0.85rem 1.2rem max(0.85rem, env(safe-area-inset-bottom));
            background: #fbf9f2;
            border-top: 1px solid var(--gold-border);
        }

        .sidebar-logout-btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            color: #c94b45;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .profile-card, .order-card {
            background: #fffdf8;
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(70, 55, 30, 0.04);
            width: 100%;
        }

        .username-input {
            flex: 1;
            padding: 0.6rem 0.75rem;
            background: #fff;
            border: 1px solid var(--gold-border);
            border-radius: 8px;
            color: var(--espresso);
            outline: none;
            font-size: 0.9rem;
        }

        .save-username-btn {
            background: linear-gradient(135deg, #c2a45e, #9e7d3e);
            color: #fff;
            border: none;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Profile Sidebar Install App Button */
        .sidebar-install-btn {
            width: 100%;
            margin-top: 0.85rem;
            padding: 0.7rem;
            background: linear-gradient(135deg, #b89b5e, #927326);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(146, 115, 38, 0.2);
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sidebar-install-btn:active {
            opacity: 0.85;
        }

        /* Mobile Item Details Bottom Sheet */
        .mobile-item-details { display: none; }

        @media (max-width: 768px) {
            .mobile-item-details {
                position: fixed;
                inset: 0;
                z-index: 2000;
                background: rgba(0, 0, 0, 0.55);
                align-items: flex-end;
                justify-content: center;
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }

            .mobile-item-details.open { display: flex; }

            .mobile-item-details-box {
                position: relative;
                width: 100%;
                max-height: 85dvh;
                overflow-y: auto;
                background: #fffdf7;
                border-radius: 20px 20px 0 0;
                border-top: 2px solid #b8953f;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
                box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
                animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            }

            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

            .mobile-item-details-box img {
                display: block;
                width: 100%;
                height: 210px;
                object-fit: cover;
            }

            .mobile-details-close {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 2;
                width: 32px;
                height: 32px;
                border: none;
                border-radius: 50%;
                background: rgba(255, 253, 247, 0.95);
                color: #927326;
                font-size: 22px;
                line-height: 32px;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            }

            .mobile-details-content { padding: 1rem; }
            .mobile-details-content h2 { margin: 0 0 4px; color: #29251d; font-size: 1.2rem; font-weight: 800; }
            #mobileDetailsCategory { color: #756f63; font-size: 0.85rem; text-transform: capitalize; margin-bottom: 8px; }
            #mobileDetailsPrice { color: #927326; font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
            #mobileDetailsStatus { color: #756f63; font-size: 0.85rem; font-weight: 600; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <button id="installFoodAppButton" class="btn-install hidden" onclick="installFoodApp()">Install App</button>

    <div class="kitchen-banner" id="kitchenClosedBanner">⚠️ The Kitchen is currently CLOSED. Preorders are temporarily paused.</div>

    <header>
        <div class="top-bar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search dishes or items...">
            </div>
            <div class="profile-btn" onclick="openProfileSidebar()" title="{{ email }}" data-initial="{{ username[0]|upper if username else 'A' }}"></div>
        </div>
    </header>

    <div class="categories-container" id="categoriesContainer">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
    </div>

    <main class="menu-list" id="menuContainer"></main>

    <!-- Cart Floating Action Bar -->
    <a href="/cart" class="floating-action-bar cart-bar" id="cartBar">
        <div class="mobile-cart-icon">🛒</div>
        <div class="cart-text-area">
            <h4 style="font-size:0.95rem;" id="cartBarTitle">View Cart</h4>
        </div>
        <div class="badge" id="cartTotalLabel">₹0.00</div>
    </a>

    <!-- Order Placed Status Bar -->
    <div class="floating-action-bar order-placed-bar" id="orderPlacedBar" onclick="openOrderProgressModal()">
        <div>
            <h4 style="font-size:0.95rem;">Order Placed!</h4>
            <div style="font-size:0.75rem; color:#fef3c7;" id="orderStatusText">Kitchen is preparing your food</div>
        </div>
        <div class="badge">Token #<span id="activeTokenId">0</span></div>
    </div>

    <!-- Order Progress Modal -->
    <div class="modal-overlay" id="orderProgressModal">
        <div class="progress-box">
            <h3 style="color:var(--gold-dark); font-size:1.25rem; font-weight:800;">Token #<span id="modalOrderId">0</span> Status</h3>
            <p style="color:var(--brown-light); font-size:0.85rem; margin-top:0.25rem;" id="modalPaymentInfo">Payment Verified • Preparing</p>

            <div class="stepper-row">
                <div class="step-col">
                    <div class="step-dot" id="dotAccepted"></div>
                    <span class="step-name">Accepted</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPreparing"></div>
                    <span class="step-name">Preparing</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotPrepared"></div>
                    <span class="step-name">Prepared</span>
                </div>
                <div class="step-col">
                    <div class="step-dot" id="dotDelivered"></div>
                    <span class="step-name">Delivered</span>
                </div>
            </div>

            <button class="btn-themed-ack" onclick="closeOrderProgressModal()">Close Status</button>
        </div>
    </div>

    <!-- Themed Notification Modal -->
    <div class="modal-overlay" id="themedPopupModal">
        <div class="themed-popup-box">
            <div class="themed-popup-icon" id="themedPopupIcon">✨</div>
            <h3 class="themed-popup-title" id="themedPopupTitle">Update</h3>
            <p class="themed-popup-msg" id="themedPopupMsg"></p>
            <div class="themed-popup-reason" id="themedPopupReason" style="display:none;"></div>
            <button class="btn-themed-ack" id="themedPopupAckBtn" onclick="closeThemedPopup()">Understood</button>
        </div>
    </div>

    <!-- Mobile Dish Details Sheet -->
    <div id="mobileItemDetails" class="mobile-item-details">
        <div class="mobile-item-details-box">
            <button class="mobile-details-close" onclick="closeMobileItemDetails()">×</button>
            <img id="mobileDetailsImage" src="" alt="Dish">
            <div class="mobile-details-content">
                <h2 id="mobileDetailsName"></h2>
                <div id="mobileDetailsCategory"></div>
                <div id="mobileDetailsPrice"></div>
                <div id="mobileDetailsStatus"></div>
            </div>
        </div>
    </div>

    <!-- Profile & Order History Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeProfileSidebar()"></div>
    <aside class="profile-sidebar" id="profileSidebar">
        <div class="sidebar-header">
            <h3 style="color:var(--gold-dark); font-size:1.15rem;">My Profile</h3>
            <button class="sidebar-close-btn" onclick="closeProfileSidebar()">&times;</button>
        </div>
        
        <div class="sidebar-body">
            <div class="profile-card">
                <label style="font-size:0.78rem; color:var(--brown-light);">Verified Gmail</label>
                <div style="font-size:0.88rem; color:var(--gold-dark); margin-bottom:0.65rem; word-break:break-all;">{{ email }}</div>

                <label style="font-size:0.78rem; color:var(--brown-light);">Display Name</label>
                <div style="display:flex; gap:0.4rem; margin-top:0.35rem;">
                    <input type="text" id="profileUsernameInput" class="username-input" value="{{ username }}">
                    <button class="save-username-btn" onclick="saveNewUsername()">Save</button>
                </div>

                <!-- Install App Button inside Profile -->
                <button id="profileInstallAppButton" class="sidebar-install-btn hidden" onclick="installFoodApp()">
                    📲 Install App on Phone
                </button>
            </div>

            <div>
                <h4 style="margin-bottom:0.65rem; color:var(--espresso); font-size:0.95rem;">Past Orders</h4>
                <div id="ordersHistoryList" style="display:flex; flex-direction:column; gap:0.65rem;"></div>
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="/logout" class="sidebar-logout-btn">Log Out</a>
        </div>
    </aside>

    <script>
        let menuItems = [];
        let categoriesList = [];
        let cartData = {};
        let currentCategory = 'all';
        let searchQuery = '';
        let activeOrder = null;
        let localMenuVersion = null;
        let lastReportedStatus = null;
        let popupOnCloseCallback = null;
        let cartTotalCached = 0.0;
        let foodAppInstallPrompt = null;

        function showThemedPopup({ title, message, icon="✨", reason=null, btnText="Understood", onClose=null }) {
            document.getElementById("themedPopupTitle").textContent = title;
            document.getElementById("themedPopupMsg").textContent = message;
            document.getElementById("themedPopupIcon").textContent = icon;
            document.getElementById("themedPopupAckBtn").textContent = btnText;

            const reasonEl = document.getElementById("themedPopupReason");
            if (reason) {
                reasonEl.innerHTML = `<strong>Reason:</strong> ${reason}`;
                reasonEl.style.display = "block";
            } else {
                reasonEl.style.display = "none";
            }

            popupOnCloseCallback = onClose;
            document.getElementById("themedPopupModal").classList.add("open");
        }

        function closeThemedPopup() {
            document.getElementById("themedPopupModal").classList.remove("open");
            if (popupOnCloseCallback) {
                popupOnCloseCallback();
                popupOnCloseCallback = null;
            }
        }

        async function checkOrderStatus() {
            try {
                const res = await fetch('/api/order/active');
                const data = await res.json();
                const orderPlacedBar = document.getElementById('orderPlacedBar');
                const cartBar = document.getElementById('cartBar');

                const closedBanner = document.getElementById('kitchenClosedBanner');
                if (!data.kitchen_open) closedBanner.classList.add('show');
                else closedBanner.classList.remove('show');

                if (localMenuVersion !== null && data.menu_version && data.menu_version !== localMenuVersion) {
                    localMenuVersion = data.menu_version;
                    loadMenuAndCart();
                } else if (localMenuVersion === null && data.menu_version) {
                    localMenuVersion = data.menu_version;
                }

                if (data.alert && data.status === 'cancelled') {
                    showThemedPopup({
                        title: "Order Cancelled",
                        message: "The order has been cancelled.",
                        icon: "❌",
                        reason: data.reason || "Payment timeout or kitchen cancellation.",
                        btnText: "Understood",
                        onClose: async () => {
                            try {
                                await fetch('/api/order/ack-alert', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ order_id: data.order_id })
                                });
                            } catch (e) {}
                        }
                    });

                    activeOrder = null;
                    lastReportedStatus = null;
                    orderPlacedBar.classList.remove('visible');
                    cartBar.classList.remove('cart-bar-unpaid');
                    loadMenuAndCart();
                    return;
                }

                if (data.alert && data.status === 'delivered') {
                    showThemedPopup({
                        title: "Order Delivered!",
                        message: `Your food (Token #${data.daily_order_number || data.order_id}) has been delivered! Enjoy your meal.`,
                        icon: "🎉",
                        btnText: "Awesome!",
                        onClose: async () => {
                            try {
                                await fetch('/api/order/ack-alert', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ order_id: data.order_id })
                                });
                            } catch (e) {}
                        }
                    });

                    activeOrder = null;
                    lastReportedStatus = null;
                    orderPlacedBar.classList.remove('visible');
                    cartBar.classList.remove('cart-bar-unpaid');
                    loadMenuAndCart();
                    return;
                }

                if (data.has_active_order) {
                    activeOrder = data;

                    if (lastReportedStatus && lastReportedStatus !== data.status) {
                        if (data.status === 'accepted') {
                            showThemedPopup({
                                title: "Order Accepted by Kitchen!",
                                message: `Chef accepted Token #${data.daily_order_number}. ${data.payment_status === 'paid' ? 'Cooking starting soon!' : 'Please complete payment now.'}`,
                                icon: "👨‍🍳",
                                btnText: "Great!"
                            });
                        } else if (data.status === 'preparing') {
                            showThemedPopup({
                                title: "Food is Preparing!",
                                message: `The kitchen is now actively preparing Token #${data.daily_order_number}!`,
                                icon: "🍳",
                                btnText: "Got it"
                            });
                        } else if (data.status === 'prepared') {
                            showThemedPopup({
                                title: "Food Ready!",
                                message: `Token #${data.daily_order_number} is prepared and ready for delivery/pickup!`,
                                icon: "🍽️",
                                btnText: "Ready"
                            });
                        }
                    }
                    lastReportedStatus = data.status;

                    if (data.payment_status === 'paid') {
                        cartBar.classList.remove('visible');
                        cartBar.classList.remove('cart-bar-unpaid');
                        orderPlacedBar.classList.add('visible');
                        document.getElementById('activeTokenId').textContent = data.daily_order_number;

                        const statusMap = {
                            'accepted': 'Order Accepted by Chef',
                            'preparing': 'Kitchen is preparing your food',
                            'prepared': 'Food is Prepared & Ready!'
                        };
                        document.getElementById('orderStatusText').textContent = statusMap[data.status] || data.status.toUpperCase();
                        updateStepperDots(data.status);
                    } else {
                        orderPlacedBar.classList.remove('visible');
                        cartBar.classList.add('visible');

                        if (data.status !== 'placed') {
                            cartBar.classList.add('cart-bar-unpaid');
                            if (data.payment_method === 'counter') {
                                document.getElementById('cartBarTitle').textContent = "Pay at Counter (Pending)";
                            } else {
                                document.getElementById('cartBarTitle').textContent = "Pay Now (Accepted)";
                            }
                        } else {
                            cartBar.classList.remove('cart-bar-unpaid');
                            const secs = data.seconds_left !== undefined ? data.seconds_left : 60;
                            document.getElementById('cartBarTitle').textContent = `Awaiting Kitchen (${secs}s)`;
                        }
                    }
                } else {
                    orderPlacedBar.classList.remove('visible');
                    cartBar.classList.remove('cart-bar-unpaid');
                    activeOrder = null;
                    document.getElementById('cartBarTitle').textContent = "View Cart";
                    updateCartUI(cartTotalCached);
                }
            } catch (err) {}
        }

        function openOrderProgressModal() {
            if (!activeOrder) return;
            document.getElementById('modalOrderId').textContent = activeOrder.daily_order_number;
            updateStepperDots(activeOrder.status);
            document.getElementById('orderProgressModal').classList.add('open');
        }

        function closeOrderProgressModal() {
            document.getElementById('orderProgressModal').classList.remove('open');
        }

        function updateStepperDots(status) {
            const stages = ['accepted', 'preparing', 'prepared', 'delivered'];
            const currentIndex = stages.indexOf(status);

            const dots = [
                document.getElementById('dotAccepted'),
                document.getElementById('dotPreparing'),
                document.getElementById('dotPrepared'),
                document.getElementById('dotDelivered')
            ];

            dots.forEach((dot, idx) => {
                if (idx <= currentIndex) dot.classList.add('green');
                else dot.classList.remove('green');
            });
        }

        async function loadMenuAndCart() {
            try {
                const res = await fetch('/api/menu');
                const data = await res.json();
                menuItems = data.items || [];
                categoriesList = data.categories || [];
                cartData = data.cart || {};
                localMenuVersion = data.menu_version;
                cartTotalCached = data.total_price || 0.0;
                renderCategoryButtons();
                updateCartUI(cartTotalCached);
                renderMenu();
            } catch (err) {}
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = `cat-btn ${currentCategory === 'all' ? 'active' : ''}`;
            allBtn.textContent = 'All';
            allBtn.onclick = function() { filterCategory('all', this); };
            container.appendChild(allBtn);

            categoriesList.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${currentCategory === cat.toLowerCase() ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = function() { filterCategory(cat.toLowerCase(), this); };
                container.appendChild(btn);
            });
        }

        function filterCategory(category, buttonEl) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonEl.classList.add('active');
            renderMenu();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderMenu();
        });

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            const filtered = menuItems.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category.toLowerCase() === currentCategory.toLowerCase();
                const matchesSearch = item.item_name.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(item => {
                const qty = cartData[item.id] !== undefined ? cartData[item.id] : (cartData[String(item.id)] || 0);
                const card = document.createElement('div');
                card.className = 'item-card';

                card.addEventListener('click', function(e) {
                    if (e.target.closest('.action-ctrl')) return;
                    if (window.innerWidth <= 768) {
                        openMobileItemDetails(item);
                    }
                });

                let actionHtml = '';
                if (item.is_active) {
                    if (qty === 0) {
                        actionHtml = `
                            <div class="action-ctrl" onclick="event.stopPropagation();">
                                <button class="action-btn" onclick="event.stopPropagation(); updateItemQuantity(${item.id}, 1)">+</button>
                            </div>
                        `;
                    } else {
                        actionHtml = `
                            <div class="action-ctrl" onclick="event.stopPropagation();">
                                <button class="action-btn" onclick="event.stopPropagation(); updateItemQuantity(${item.id}, -1)">−</button>
                                <span class="qty-label">${qty}</span>
                                <button class="action-btn" onclick="event.stopPropagation(); updateItemQuantity(${item.id}, 1)">+</button>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="photo-container">
                        <img src="${item.photo_url || 'https://via.placeholder.com/600x400'}" alt="${item.item_name}">
                        <span class="status-dot ${item.is_active ? 'active' : 'inactive'}"></span>
                        ${actionHtml}
                    </div>
                    <div class="item-info">
                        <div class="item-text" title="${item.item_name}">
                            <h3>${item.item_name}</h3>
                            <div class="item-category">${item.category}</div>
                        </div>
                        <div class="item-price">₹${Number(item.price).toFixed(2)}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateItemQuantity(itemId, delta) {
            try {
                const res = await fetch('/api/cart/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId, delta })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    cartData = data.cart;
                    cartTotalCached = data.total_price;
                    updateCartUI(data.total_price);
                    renderMenu();
                }
            } catch (err) {}
        }

        function updateCartUI(totalPrice) {
            const cartBar = document.getElementById('cartBar');
            const orderPlacedBar = document.getElementById('orderPlacedBar');
            if (orderPlacedBar.classList.contains('visible')) {
                cartBar.classList.remove('visible');
                return;
            }
            const hasItems = Object.values(cartData || {}).some(qty => Number(qty) > 0);
            if (hasItems || (activeOrder && activeOrder.payment_status !== 'paid')) {
                cartBar.classList.add('visible');
                document.getElementById('cartTotalLabel').textContent = `₹${Number(totalPrice || 0).toFixed(2)}`;
            } else {
                cartBar.classList.remove('visible');
            }
        }

        function openProfileSidebar() {
            document.getElementById('profileSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            fetchOrderHistory();
        }

        function closeProfileSidebar() {
            document.getElementById('profileSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        async function saveNewUsername() {
            const newName = document.getElementById('profileUsernameInput').value.trim();
            if (!newName) return;
            const res = await fetch('/api/profile/update-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: newName })
            });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            }
        }

        async function fetchOrderHistory() {
            const listEl = document.getElementById('ordersHistoryList');
            listEl.innerHTML = '<div style="color:var(--brown-light); padding:1rem;">Loading...</div>';
            const res = await fetch('/api/profile/orders');
            const data = await res.json();
            if (!data.orders || data.orders.length === 0) {
                listEl.innerHTML = '<div style="color:var(--brown-light); padding:1rem;">No past orders.</div>';
                return;
            }
            listEl.innerHTML = '';
            data.orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                
                const typeText = order.order_type === 'parcel' ? '📦 Parcel' : '🍽️ Dine In';
                let payMethodText = '💳 Not Selected';
                if (order.payment_method === 'counter') payMethodText = '💵 Pay at Counter';
                else if (order.payment_method === 'online') payMethodText = '📱 PhonePe/Online';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>Token #${order.daily_order_number}</strong>
                        <span style="font-weight:700; text-transform:uppercase; font-size:0.75rem;">${order.order_status}</span>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.3rem 0; font-size:0.75rem; font-weight:700;">
                        <span style="background:#f4efe2; padding:0.15rem 0.45rem; border-radius:6px;">${typeText}</span>
                        <span style="background:#f4efe2; padding:0.15rem 0.45rem; border-radius:6px;">${payMethodText}</span>
                    </div>
                    <div style="font-size:0.82rem; color:var(--brown-light); margin:0.35rem 0;">${order.items.join(', ')}</div>
                    ${order.cancellation_reason ? `<div style="color:#c94b45; font-size:0.78rem;">Reason: ${order.cancellation_reason}</div>` : ''}
                    <div style="display:flex; justify-content:space-between; font-weight:800; color:var(--gold-dark); margin-top:0.3rem; font-size:0.92rem;">
                        <span>Total (${order.payment_status.toUpperCase()})</span>
                        <span>₹${order.total_amount.toFixed(2)}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function openMobileItemDetails(item) {
            if (window.innerWidth > 768) return;
            document.getElementById('mobileDetailsImage').src = item.photo_url || 'https://via.placeholder.com/600x400';
            document.getElementById('mobileDetailsImage').alt = item.item_name || 'Food item';
            document.getElementById('mobileDetailsName').textContent = item.item_name || '';
            document.getElementById('mobileDetailsCategory').textContent = item.category || '';
            document.getElementById('mobileDetailsPrice').textContent = '₹' + Number(item.price || 0).toFixed(2);
            document.getElementById('mobileDetailsStatus').textContent = item.is_active ? 'Available' : 'Currently unavailable';
            document.getElementById('mobileItemDetails').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileItemDetails() {
            document.getElementById('mobileItemDetails').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('mobileItemDetails').addEventListener('click', function(e) {
            if (e.target === this) closeMobileItemDetails();
        });

        // PWA Setup & Event Listeners
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js").catch(err => console.warn("PWA setup unavailable", err));
            });
        }

        window.addEventListener("beforeinstallprompt", event => {
            event.preventDefault();
            foodAppInstallPrompt = event;
            
            // Show both buttons when prompt is ready
            const topBtn = document.getElementById("installFoodAppButton");
            const profileBtn = document.getElementById("profileInstallAppButton");
            if (topBtn) topBtn.classList.remove("hidden");
            if (profileBtn) profileBtn.classList.remove("hidden");
        });

        async function installFoodApp() {
            if (!foodAppInstallPrompt) {
                alert("To install: tap your browser menu (⋮ or share icon) and select 'Install app' or 'Add to Home screen'.");
                return;
            }
            foodAppInstallPrompt.prompt();
            await foodAppInstallPrompt.userChoice;
            foodAppInstallPrompt = null;
            
            const topBtn = document.getElementById("installFoodAppButton");
            const profileBtn = document.getElementById("profileInstallAppButton");
            if (topBtn) topBtn.classList.add("hidden");
            if (profileBtn) profileBtn.classList.add("hidden");
        }

        async function init() {
            await loadMenuAndCart();
            await checkOrderStatus();
            setInterval(checkOrderStatus, 2000);
        }
        init();
    </script>
</body>
</html>
