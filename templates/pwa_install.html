<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{ app_info.theme }}">
<link rel="manifest" href="/manifest/{{ role }}.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/{{ role }}-192.png">
<title>Install {{ app_info.name }}</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fffdf8,#f4efe2);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#302a20;padding:18px}
.card{width:min(470px,100%);background:#fffdf7;border:1px solid #ded3b8;border-radius:22px;padding:26px;box-shadow:0 18px 60px #00000014;text-align:center}
.icon{width:96px;height:96px;border-radius:22px;margin:auto;display:grid;place-items:center;background:#f5ecd8;font-size:48px}.title{margin:15px 0 5px}.sub{color:#766d5d;font-size:.9rem;line-height:1.45}
button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:18px;background:var(--app-theme);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.status{margin-top:14px;color:#766d5d;font-size:.8rem;min-height:20px}
.permission{margin-top:14px;padding:12px;border-radius:11px;background:#fff9eb;border:1px dashed #d8bd70;font-size:.8rem;line-height:1.4}
</style>
<script>
window.PWA_ROLE="{{ role }}";
</script>
<script src="/static/js/pwa.js" defer></script>
</head>
<body data-pwa-role="{{ role }}" style="--app-theme: {{ app_info.theme }};">
<div class="card">
<div class="icon">{{ '🛒' if role == 'customer' else ('🧾' if role == 'reception' else '🍳') }}</div>
<h1 class="title">{{ app_info.name }}</h1><div class="sub">{{ app_info.description }}</div>
<button id="installButton">Install {{ app_info.short_name }} App</button>
<div id="status" class="status">Checking installation support…</div>
<div class="permission">After installing the app, notification controls are available inside the application.</div>
</div>
</body></html>
