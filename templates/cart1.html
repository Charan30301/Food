<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Bill - Grand Palace Hotel</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --bg: #0b1329;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #0284c7;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem 1rem 4rem; }
        .container { max-width: 600px; margin: 0 auto; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .back-btn { color: var(--primary); text-decoration: none; font-size: 1rem; }

        .cart-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
        .cart-row {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 0.75rem; display: flex; align-items: center; gap: 1rem;
        }
        .item-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        .item-details { flex: 1; }
        .item-details h4 { font-size: 0.95rem; margin-bottom: 0.2rem; }
        .item-cat { font-size: 0.75rem; color: var(--muted); text-transform: capitalize; }
        .item-qty-badge { background: #0f172a; border: 1px solid var(--border); padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.85rem; }
        .item-line-total { font-weight: 700; color: #38bdf8; min-width: 70px; text-align: right; }

        .bill-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .bill-total { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; border-top: 1px dashed var(--border); padding-top: 0.75rem; margin-top: 0.75rem; }

        .pay-btn {
            width: 100%; background: var(--success); color: white; border: none;
            padding: 1rem; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: background 0.2s;
        }
        .pay-btn:hover { background: #059669; }
        .pay-btn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="/menu" class="back-btn">← Back to Menu</a>
        <h2>Review & Pay</h2>
    </div>

    <div class="cart-list" id="cartItemsList"></div>

    <div class="bill-card" id="billBox" style="display:none;">
        <div class="bill-total">
            <span>To Pay</span>
            <span id="totalPayableLabel">₹0.00</span>
        </div>
        <button class="pay-btn" id="payBtn" onclick="initiatePayment()" style="margin-top: 1.25rem;">
            {% if test_mode %}Place Test Order (Instant){% else %}Pay with UPI / Apps{% endif %}
        </button>
    </div>
</div>

<script>
    const IS_TEST_MODE = "{{ 'true' if test_mode else 'false' }}" === "true";
    const RZP_KEY_ID = "{{ rzp_key }}";
    const USER_EMAIL = "{{ email }}";
    const USER_NAME = "{{ username }}";
    let cartTotal = 0;

    async function loadCartData() {
        const res = await fetch('/api/cart/items');
        const data = await res.json();
        const list = document.getElementById('cartItemsList');
        const billBox = document.getElementById('billBox');

        if (!data.items || data.items.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--muted); padding:3rem;">Your cart is empty.</p>';
            billBox.style.display = 'none';
            return;
        }

        cartTotal = data.total_price;
        list.innerHTML = '';
        data.items.forEach(item => {
            list.innerHTML += `
                <div class="cart-row">
                    <img src="${item.photo_url}" class="item-thumb" alt="${item.item_name}">
                    <div class="item-details">
                        <h4>${item.item_name}</h4>
                        <div class="item-cat">${item.category}</div>
                    </div>
                    <div class="item-qty-badge">${item.quantity} pcs</div>
                    <div class="item-line-total">₹${item.line_total.toFixed(2)}</div>
                </div>
            `;
        });

        document.getElementById('totalPayableLabel').textContent = `₹${cartTotal.toFixed(2)}`;
        billBox.style.display = 'block';
    }

    async function initiatePayment() {
        const payBtn = document.getElementById('payBtn');
        payBtn.disabled = true;

        // If running in TEST_MODE, place the order directly without gateway popups
        if (IS_TEST_MODE) {
            payBtn.textContent = 'Placing Test Order...';
            try {
                const res = await fetch('/api/test/place-order', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect_url;
                } else {
                    alert(data.error || 'Failed to place test order');
                    payBtn.disabled = false;
                }
            } catch (err) {
                alert('Network error while placing test order');
                payBtn.disabled = false;
            }
            return;
        }

        // Standard Razorpay Gateway Flow
        payBtn.textContent = 'Opening Secure Gateway...';
        try {
            const res = await fetch('/api/payment/create-order', { method: 'POST' });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Order creation failed");
                payBtn.disabled = false;
                payBtn.textContent = 'Pay with UPI / Apps';
                return;
            }

            const options = {
                "key": RZP_KEY_ID,
                "amount": data.amount,
                "currency": data.currency,
                "name": "Grand Palace Hotel",
                "description": "Preorder Food Payment",
                "order_id": data.gateway_order_id,
                "prefill": { "name": USER_NAME, "email": USER_EMAIL },
                "theme": { "color": "#0284c7" },
                "handler": async function (response) {
                    const verifyRes = await fetch('/api/payment/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    });
                    const verifyData = await verifyRes.json();
                    if (verifyData.success) {
                        window.location.href = verifyData.redirect_url;
                    } else {
                        alert("Verification failed: " + verifyData.error);
                        payBtn.disabled = false;
                    }
                }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        } catch (err) {
            alert("Unable to open payment modal");
            payBtn.disabled = false;
        }
    }

    loadCartData();
</script>
</body>
</html>
