<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Order & Cart - Grand Palace Hotel</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --ivory: #f7f3e8;
            --cream: #eee8d8;
            --gold: #b8953f;
            --gold-dark: #927326;
            --gold-light: #d8bd70;
            --gold-border: #d8c9a4;
            --espresso: #30291f;
            --brown-light: #6e6250;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #fbf9f2 0%, #f7f3e8 45%, #eee8d8 100%) !important;
            color: var(--espresso) !important;
            min-height: 100vh;
            padding: 1.5rem 1rem 4rem;
        }

        .container { width: 100%; max-width: 700px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 1.5rem; }
        .back-btn { color: var(--gold-dark); text-decoration: none; font-size: 1rem; font-weight: 700; }
        .back-btn:hover { color: var(--gold); }

        .cart-list { display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.5rem; }
        .cart-row {
            background: rgba(255, 253, 247, 0.96); border: 1px solid var(--gold-border);
            border-radius: 16px; padding: 0.9rem; display: flex; align-items: center; gap: 1rem;
            box-shadow: 0 3px 12px rgba(105, 83, 30, 0.08);
        }
        .item-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid #e8dfc5; }
        .item-details { flex: 1; min-width: 0; }
        .item-details h4 { color: var(--espresso); font-size: 1rem; margin-bottom: 0.2rem; }
        .item-details span { color: var(--brown-light); font-size: 0.8rem; text-transform: capitalize; }
        .item-qty-badge {
            background: #f4efe2; color: var(--espresso); border: 1px solid var(--gold-border);
            padding: 0.35rem 0.65rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
        }
        .item-line-total { font-weight: 800; color: var(--gold-dark); min-width: 85px; text-align: right; }

        .bill-card {
            background: rgba(255, 253, 247, 0.98); border: 1px solid var(--gold-border);
            border-radius: 18px; padding: 1.4rem; box-shadow: 0 5px 20px rgba(105, 83, 30, 0.09);
        }
        .bill-total {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.35rem; font-weight: 800; color: var(--espresso);
            border-top: 1px dashed var(--gold-border); padding-top: 1rem; margin-top: 1rem;
        }
        .bill-total span { color: var(--gold-dark); }

        .action-btn {
            width: 100%; background: linear-gradient(135deg, #c4a34d, #a7832f);
            color: #fffdf7; border: 1px solid #a7832f; border-radius: 12px;
            padding: 1rem; font-size: 1.05rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(168, 132, 47, 0.25); transition: 0.25s; margin-top: 1.25rem;
        }
        .action-btn:disabled { background: #b5ac9a !important; border-color: #b5ac9a !important; cursor: not-allowed; }

        /* SOLID GREEN PAY NOW BUTTON */
        .btn-pay-green {
            background: linear-gradient(135deg, #22a878, #13845e) !important;
            border: 1px solid #0f684a !important;
            box-shadow: 0 6px 20px rgba(24, 168, 120, 0.45) !important;
            color: #ffffff !important;
            animation: pulse-green 1.5s infinite alternate;
        }
        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .timer-box {
            display: none; width: 100%; margin-top: 1rem; padding: 16px 12px; text-align: center;
            background: linear-gradient(135deg, #d8bd70, #b8953f); border: 1px solid #927326;
            border-radius: 14px; box-sizing: border-box; color: #fffdf7;
        }
        .timer-val { font-size: 2rem; font-weight: 800; letter-spacing: 1px; margin-top: 0.3rem; }

        /* THEMED MODAL (Replaces all browser alert() and confirm()) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(48, 41, 31, 0.45); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.open { display: flex; }
        .themed-dialog {
            background: #fffdf7; border: 1px solid var(--gold-border); border-radius: 20px;
            padding: 2rem; width: 90%; max-width: 440px; text-align: center;
            box-shadow: 0 20px 55px rgba(55,43,20,0.22);
        }
        .themed-dialog-title { font-size: 1.25rem; font-weight: 800; color: var(--espresso); margin-bottom: 0.6rem; }
        .themed-dialog-msg { font-size: 0.95rem; color: var(--brown-light); line-height: 1.5; margin-bottom: 1.4rem; }
        .dialog-buttons-row { display: flex; gap: 0.75rem; justify-content: center; }
        .btn-dialog-primary {
            flex: 1; padding: 0.8rem; background: linear-gradient(135deg, #d8bd70, #b8953f);
            color: #fffdf7; border: 1px solid #927326; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        .btn-dialog-secondary {
            flex: 1; padding: 0.8rem; background: #fffdf7; color: #665b48;
            border: 1px solid #d7cbb0; border-radius: 999px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="/menu" class="back-btn">← Back to Menu</a>
        <h2>Checkout & Confirm</h2>
    </div>

    <div class="cart-list" id="cartItemsList"></div>

    <div class="bill-card" id="billBox" style="display:none;">
        <div class="bill-total">
            <span>To Pay</span>
            <span id="totalPayableLabel">₹0.00</span>
        </div>

        <button class="action-btn" id="mainActionButton" onclick="handleActionButtonClick()">Place Order & Await Acceptance</button>

        <div class="timer-box" id="timerBox">
            <h3>Waiting for Kitchen to Accept</h3>
            <div class="timer-val" id="timerDisplay">01:00</div>
        </div>
    </div>
</div>

<!-- THEMED CUSTOM DIALOG -->
<div class="modal-overlay" id="customDialogModal">
    <div class="themed-dialog">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;" id="dialogIcon">✨</div>
        <h3 class="themed-dialog-title" id="dialogTitle">Notice</h3>
        <p class="themed-dialog-msg" id="dialogMsg"></p>
        <div class="dialog-buttons-row" id="dialogButtonsRow">
            <button class="btn-dialog-primary" id="dialogPrimaryBtn" onclick="handleDialogSubmit(true)">OK</button>
            <button class="btn-dialog-secondary" id="dialogSecondaryBtn" style="display:none;" onclick="handleDialogSubmit(false)">Cancel</button>
        </div>
    </div>
</div>

<script>
    const IS_TEST_MODE = "{{ 'true' if test_mode else 'false' }}" === "true";
    const RZP_KEY_ID = "{{ rzp_key }}";
    const USER_EMAIL = "{{ email }}";
    const USER_NAME = "{{ username }}";

    let cartTotal = 0;
    let submittedOrderId = null;
    let currentActiveOrder = null;
    let timerInterval = null;
    let pollInterval = null;
    let secondsLeft = 60;
    let orderState = "cart";
    let dialogCallback = null;

    // Themed Dialog Popup Function
    function showThemedPopup({ title, message, icon="✨", confirmText="OK", cancelText=null, onResolve=null }) {
        document.getElementById("dialogTitle").textContent = title;
        document.getElementById("dialogMsg").textContent = message;
        document.getElementById("dialogIcon").textContent = icon;
        document.getElementById("dialogPrimaryBtn").textContent = confirmText;

        const secondaryBtn = document.getElementById("dialogSecondaryBtn");
        if (cancelText) {
            secondaryBtn.textContent = cancelText;
            secondaryBtn.style.display = "block";
        } else {
            secondaryBtn.style.display = "none";
        }

        dialogCallback = onResolve;
        document.getElementById("customDialogModal").classList.add("open");
    }

    function handleDialogSubmit(isConfirmed) {
        document.getElementById("customDialogModal").classList.remove("open");
        if (dialogCallback) {
            dialogCallback(isConfirmed);
            dialogCallback = null;
        }
    }

    async function handleKitchenCancellation(data) {
        clearInterval(timerInterval);
        clearInterval(pollInterval);

        const reason = data.reason || "The kitchen was unable to accept your order.";
        showThemedPopup({
            title: "Order Cancelled by Kitchen",
            message: `Reason: ${reason}`,
            icon: "❌",
            confirmText: "Understood",
            onResolve: async () => {
                try {
                    await fetch('/api/order/ack-alert', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: data.order_id })
                    });
                } catch (e) {}
                window.location.replace("/menu");
            }
        });
    }

    async function loadCartData() {
        const statusRes = await fetch('/api/order/active');
        const statusData = await statusRes.json();

        if (statusData.alert && statusData.status === 'cancelled') {
            await handleKitchenCancellation(statusData);
            return;
        }

        if (statusData.has_active_order && statusData.status === 'placed') {
            submittedOrderId = statusData.order_id;
            currentActiveOrder = statusData;
            secondsLeft = statusData.seconds_left !== undefined ? statusData.seconds_left : 60;
            orderState = "awaiting_acceptance";
            await renderCartItems();
            setAwaitingAcceptanceUI();
            return;
        }

        if (statusData.has_active_order && statusData.status !== 'placed' && statusData.payment_status !== 'paid') {
            submittedOrderId = statusData.order_id;
            currentActiveOrder = statusData;
            orderState = "accepted_unpaid";
            await renderCartItems();
            setPayNowUI();
            return;
        }

        orderState = "cart";
        await renderCartItems();
    }

    async function renderCartItems() {
        const res = await fetch('/api/cart/items');
        const data = await res.json();
        const list = document.getElementById('cartItemsList');
        const billBox = document.getElementById('billBox');

        if (!data.items || data.items.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--brown-light); padding:3rem;">Your cart is empty.</p>';
            billBox.style.display = 'none';
            return;
        }

        cartTotal = data.total_price;
        list.innerHTML = '';
        data.items.forEach(item => {
            list.innerHTML += `
                <div class="cart-row">
                    <img src="${item.photo_url}" class="item-thumb" alt="${item.item_name}" onerror="this.src='https://via.placeholder.com/64'">
                    <div class="item-details">
                        <h4>${item.item_name}</h4>
                        <span>${item.category}</span>
                    </div>
                    <div class="item-qty-badge">${item.quantity} pcs</div>
                    <div class="item-line-total">₹${item.line_total.toFixed(2)}</div>
                </div>
            `;
        });

        document.getElementById('totalPayableLabel').textContent = `₹${cartTotal.toFixed(2)}`;
        billBox.style.display = 'block';
    }

    function handleActionButtonClick() {
        if (orderState === "cart") {
            requestOrderAcceptance();
        } else if (orderState === "accepted_unpaid") {
            launchPaymentFlow(currentActiveOrder);
        }
    }

    async function requestOrderAcceptance() {
        const btn = document.getElementById('mainActionButton');
        btn.disabled = true;
        btn.textContent = "Submitting to Kitchen...";

        try {
            const res = await fetch('/api/order/submit-request', { method: 'POST' });
            const data = await res.json();

            if (!res.ok) {
                showThemedPopup({
                    title: "Order Failed",
                    message: data.error || "Unable to place order.",
                    icon: "❌"
                });
                btn.disabled = false;
                btn.textContent = "Place Order & Await Acceptance";
                return;
            }

            submittedOrderId = data.order_id;
            orderState = "awaiting_acceptance";
            secondsLeft = 60;
            setAwaitingAcceptanceUI();

        } catch (err) {
            showThemedPopup({
                title: "Network Error",
                message: "Unable to connect to server.",
                icon: "⚠️"
            });
            btn.disabled = false;
            btn.textContent = "Place Order & Await Acceptance";
        }
    }

    function setAwaitingAcceptanceUI() {
        const btn = document.getElementById('mainActionButton');
        const timerBox = document.getElementById('timerBox');

        timerBox.style.display = 'block';
        btn.disabled = true;
        btn.className = "action-btn";
        btn.textContent = "Awaiting Kitchen Acceptance...";

        updateTimerDisplay();

        clearInterval(timerInterval);
        clearInterval(pollInterval);

        timerInterval = setInterval(handleTimerTick, 1000);
        pollInterval = setInterval(checkIfAccepted, 1500);
    }

    function setPayNowUI() {
        clearInterval(timerInterval);
        clearInterval(pollInterval);
        timerInterval = null;
        pollInterval = null;

        const timerBox = document.getElementById('timerBox');
        if (timerBox) timerBox.style.display = 'none';

        const btn = document.getElementById('mainActionButton');
        if (btn) {
            btn.disabled = false;
            // VIBRANT GREEN BUTTON
            btn.className = "action-btn btn-pay-green";
            const amt = currentActiveOrder ? currentActiveOrder.total_amount.toFixed(2) : cartTotal.toFixed(2);
            btn.textContent = `Pay Now (Accepted) - ₹${amt}`;
        }
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
    }

    function handleTimerTick() {
        secondsLeft--;
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            clearInterval(pollInterval);
            handleTimeoutCancellation();
            return;
        }
        updateTimerDisplay();
    }

    async function checkIfAccepted() {
        try {
            const res = await fetch('/api/order/active');
            const data = await res.json();

            if (data.alert && data.status === 'cancelled') {
                await handleKitchenCancellation(data);
                return;
            }

            // Kitchen accepted the order
            if (data.has_active_order && data.status !== 'placed') {
                currentActiveOrder = data;
                orderState = "accepted_unpaid";
                setPayNowUI();

                // Show Themed Acceptance Popup
                showThemedPopup({
                    title: "Kitchen Accepted Your Order!",
                    message: `Chef accepted Token #${data.daily_order_number}! Click 'Pay Now' to complete your order.`,
                    icon: "🎉",
                    confirmText: "Pay Now",
                    cancelText: "Later",
                    onResolve: (confirmed) => {
                        if (confirmed) {
                            launchPaymentFlow(data);
                        }
                    }
                });
            }
        } catch (e) {}
    }

    async function handleTimeoutCancellation() {
        await fetch('/api/order/timeout-cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: submittedOrderId })
        });

        showThemedPopup({
            title: "Order Timed Out",
            message: "The kitchen is not accepting orders, please try again in a few minutes.",
            icon: "⏳",
            confirmText: "Back to Menu",
            onResolve: () => {
                window.location.href = "/menu";
            }
        });
    }

    async function launchPaymentFlow(orderData) {
        if (IS_TEST_MODE) {
            showThemedPopup({
                title: "Confirm Test Payment",
                message: `Pay ₹${orderData.total_amount.toFixed(2)} for Token #${orderData.daily_order_number}?`,
                icon: "💳",
                confirmText: "Confirm Pay",
                cancelText: "Cancel",
                onResolve: async (confirmed) => {
                    if (confirmed) {
                        try {
                            const payRes = await fetch('/api/payment/confirm-test', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ order_id: orderData.order_id })
                            });
                            const payData = await payRes.json();
                            if (payData.success) {
                                showThemedPopup({
                                    title: "Payment Successful!",
                                    message: "Your preorder has been placed and sent to the kitchen!",
                                    icon: "✅",
                                    confirmText: "View Menu Status",
                                    onResolve: () => {
                                        window.location.href = "/menu";
                                    }
                                });
                            }
                        } catch (err) {
                            showThemedPopup({ title: "Error", message: "Network error recording payment.", icon: "❌" });
                        }
                    }
                }
            });
            return;
        }

        // Live Razorpay
        const options = {
            "key": RZP_KEY_ID,
            "amount": Math.round(orderData.total_amount * 100),
            "currency": "INR",
            "name": "Grand Palace Hotel",
            "description": `Token #${orderData.daily_order_number}`,
            "order_id": orderData.gateway_order_id,
            "prefill": { "name": USER_NAME, "email": USER_EMAIL },
            "theme": { "color": "#b8953f" },
            "handler": async function (response) {
                const verifyRes = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    })
                });
                const verifyData = await verifyRes.json();
                if (verifyData.success) {
                    showThemedPopup({
                        title: "Payment Verified!",
                        message: "Your order is placed and the kitchen is preparing your food!",
                        icon: "✅",
                        confirmText: "View Status",
                        onResolve: () => {
                            window.location.href = "/menu";
                        }
                    });
                }
            }
        };

        const rzp = new Razorpay(options);
        rzp.open();
    }

    loadCartData();
</script>
</body>
</html>
