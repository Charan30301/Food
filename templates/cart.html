<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Review Order & Cart - Grand Palace Hotel</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --ivory: #f7f3e8;
            --cream: #eee8d8;
            --gold: #b8953f;
            --gold-dark: #927326;
            --gold-light: #d8bd70;
            --gold-border: #d8c9a4;
            --espresso: #30291f;
            --brown-light: #6e6250;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
        
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #fbf9f2 0%, #f7f3e8 45%, #eee8d8 100%) !important;
            color: var(--espresso) !important;
            min-height: 100vh;
            padding: 1rem 0.75rem 4.5rem;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 1.15rem;
        }
        .header h2 {
            font-size: 1.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .back-btn {
            color: var(--gold-dark);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1.15rem;
        }
        .cart-row {
            background: rgba(255, 253, 247, 0.96);
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            padding: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            box-shadow: 0 3px 12px rgba(105, 83, 30, 0.08);
            width: 100%;
        }
        .item-thumb {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e8dfc5;
            flex-shrink: 0;
        }
        .item-details { flex: 1; min-width: 0; }
        .item-details h4 {
            color: var(--espresso);
            font-size: 0.92rem;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-details span {
            color: var(--brown-light);
            font-size: 0.75rem;
            text-transform: capitalize;
            display: block;
        }
        .item-qty-badge {
            background: #f4efe2;
            color: var(--espresso);
            border: 1px solid var(--gold-border);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .item-line-total {
            font-weight: 800;
            color: var(--gold-dark);
            font-size: 0.92rem;
            text-align: right;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bill-card {
            background: rgba(255, 253, 247, 0.98);
            border: 1px solid var(--gold-border);
            border-radius: 16px;
            padding: 1.1rem;
            box-shadow: 0 5px 20px rgba(105, 83, 30, 0.09);
            width: 100%;
        }
        .bill-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--espresso);
            border-top: 1px dashed var(--gold-border);
            padding-top: 0.85rem;
            margin-top: 0.85rem;
        }
        .bill-total span { color: var(--gold-dark); }

        .order-type-box {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--gold-border);
        }
        .order-type-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--espresso);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        .order-type-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .order-type-btn {
            background: #fffdf8;
            border: 2px solid var(--gold-border);
            border-radius: 10px;
            padding: 0.7rem 0.5rem;
            font-weight: 800;
            font-size: 0.88rem;
            color: var(--brown-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }
        .order-type-btn.active {
            background: linear-gradient(135deg, #d8bd70, #b8953f);
            color: #fffdf7;
            border-color: #927326;
            box-shadow: 0 4px 14px rgba(184, 149, 63, 0.3);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #c4a34d, #a7832f);
            color: #fffdf7;
            border: 1px solid #a7832f;
            border-radius: 12px;
            padding: 0.95rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(168, 132, 47, 0.25);
            transition: 0.25s;
            margin-top: 1rem;
        }
        .action-btn:disabled {
            background: #b5ac9a !important;
            border-color: #b5ac9a !important;
            cursor: not-allowed;
        }

        .btn-pay-green {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            border: 1px solid #047857 !important;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45) !important;
            color: #ffffff !important;
            animation: pulse-green 1.5s infinite alternate;
        }
        @keyframes pulse-green {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .timer-box {
            display: none;
            width: 100%;
            margin-top: 0.85rem;
            padding: 12px 10px;
            text-align: center;
            background: linear-gradient(135deg, #d8bd70, #b8953f);
            border: 1px solid #927326;
            border-radius: 12px;
            box-sizing: border-box;
            color: #fffdf7;
        }
        .timer-val {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        /* Full Responsive Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(48, 41, 31, 0.55);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 12px;
        }
        .modal-overlay.open { display: flex; }
        
        .themed-dialog {
            background: #fffdf7;
            border: 1px solid var(--gold-border);
            border-radius: 18px;
            padding: 1.4rem 1.15rem;
            width: 100%;
            max-width: 400px;
            max-height: 88vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 55px rgba(55,43,20,0.25);
            position: relative;
        }
        .themed-dialog-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--espresso);
            margin-bottom: 0.45rem;
        }
        .themed-dialog-msg {
            font-size: 0.88rem;
            color: var(--brown-light);
            line-height: 1.4;
            margin-bottom: 1.1rem;
        }
        .dialog-buttons-row {
            display: flex;
            gap: 0.55rem;
            justify-content: center;
        }
        .btn-dialog-primary {
            flex: 1;
            padding: 0.75rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fffdf7;
            border: 1px solid #047857;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
        }
        .btn-dialog-secondary {
            flex: 1;
            padding: 0.75rem;
            background: #fffdf7;
            color: #665b48;
            border: 1px solid #d7cbb0;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .pay-choice-grid {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1rem;
        }
        .pay-choice-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem;
            background: #fffaf0;
            border: 2px solid var(--gold-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }
        .pay-choice-btn:hover {
            border-color: var(--gold-dark);
            background: #fff5e0;
        }
        .pay-choice-icon { font-size: 1.6rem; flex-shrink: 0; }
        .pay-choice-info h4 {
            margin: 0 0 2px 0;
            color: var(--espresso);
            font-size: 0.92rem;
            font-weight: 800;
        }
        .pay-choice-info span {
            font-size: 0.75rem;
            color: var(--brown-light);
            line-height: 1.3;
            display: block;
        }

        .tax-breakdown-box {
            background: #f7f2e7;
            border: 1px solid #e2d7c0;
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            margin-bottom: 0.85rem;
            font-size: 0.82rem;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .tax-line { display: flex; justify-content: space-between; color: var(--espresso); }
    </style>
    <meta name="theme-color" content="#b8953f">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
</head>
<body>\n<button id="installFoodAppButton" hidden onclick="installFoodApp()" style="position:fixed;z-index:9999;top:12px;right:12px;border:0;border-radius:999px;padding:9px 13px;background:#b8953f;color:white;font-weight:800;box-shadow:0 3px 12px #0002;">Install App</button>

<div class="container">
    <div class="header">
        <a href="/menu" class="back-btn">← Back</a>
        <h2>Checkout & Confirm</h2>
    </div>

    <div class="cart-list" id="cartItemsList"></div>

    <div class="bill-card" id="billBox" style="display:none;">
        <div class="bill-total">
            <span>Food Total</span>
            <span id="totalPayableLabel">₹0.00</span>
        </div>

        <div class="order-type-box" id="orderTypeBox">
            <span class="order-type-label">Select Order Type:</span>
            <div class="order-type-options">
                <button type="button" class="order-type-btn active" id="btnDineIn" onclick="selectOrderType('dine_in')">
                    <span>🍽️</span>
                    <span>Dine In</span>
                </button>
                <button type="button" class="order-type-btn" id="btnParcel" onclick="selectOrderType('parcel')">
                    <span>📦</span>
                    <span>Parcel</span>
                </button>
            </div>
        </div>

        <button class="action-btn" id="mainActionButton" onclick="handleActionButtonClick()">Place Order & Await Acceptance</button>

        <div class="timer-box" id="timerBox">
            <h3 style="font-size:0.95rem;">Waiting for Kitchen to Accept</h3>
            <div class="timer-val" id="timerDisplay">01:00</div>
        </div>
    </div>
</div>

<!-- PAYMENT METHOD CHOICE MODAL (Shows Digital Service Tax Breakdown) -->
<div class="modal-overlay" id="paymentMethodModal">
    <div class="themed-dialog">
        <div style="font-size: 2rem; margin-bottom: 0.25rem;">💳</div>
        <h3 class="themed-dialog-title">Choose Payment Method</h3>
        <p class="themed-dialog-msg">Base Bill: <strong id="choiceModalAmountLabel" style="color:var(--gold-dark);">₹0.00</strong></p>

        <div class="pay-choice-grid">
            <button type="button" class="pay-choice-btn" onclick="executePaymentChoice('counter')">
                <div class="pay-choice-icon">💵</div>
                <div class="pay-choice-info">
                    <h4>Pay at Counter (Cash)</h4>
                    <span>Pay at counter. No extra service tax added.</span>
                    <strong style="color:var(--gold-dark); display:block; margin-top:2px;" id="counterPayLabel">₹0.00</strong>
                </div>
            </button>
            <button type="button" class="pay-choice-btn" onclick="executePaymentChoice('online')">
                <div class="pay-choice-icon">📱</div>
                <div class="pay-choice-info">
                    <h4>PhonePe / UPI / Gateway</h4>
                    <span>Online gateway (+<span id="serviceTaxPercentLabel">5.0</span>% Service Tax).</span>
                    <strong style="color:#047857; display:block; margin-top:2px;" id="onlinePayLabel">₹0.00</strong>
                </div>
            </button>
        </div>

        <button type="button" class="btn-dialog-secondary" style="width:100%;" onclick="closePaymentMethodModal()">Back</button>
    </div>
</div>

<div class="modal-overlay" id="customDialogModal">
    <div class="themed-dialog">
        <div style="font-size: 2.2rem; margin-bottom: 0.3rem;" id="dialogIcon">✨</div>
        <h3 class="themed-dialog-title" id="dialogTitle">Notice</h3>
        <p class="themed-dialog-msg" id="dialogMsg"></p>
        <div class="dialog-buttons-row" id="dialogButtonsRow">
            <button class="btn-dialog-primary" id="dialogPrimaryBtn" onclick="handleDialogSubmit(true)">OK</button>
            <button class="btn-dialog-secondary" id="dialogSecondaryBtn" style="display:none;" onclick="handleDialogSubmit(false)">Cancel</button>
        </div>
    </div>
</div>

<script>
    const IS_TEST_MODE = "{{ 'true' if test_mode else 'false' }}" === "true";
    const RZP_KEY_ID = "{{ rzp_key }}";
    const USER_EMAIL = "{{ email }}";
    const USER_NAME = "{{ username }}";

    let cartTotal = 0;
    let submittedOrderId = null;
    let currentActiveOrder = null;
    let timerInterval = null;
    let pollInterval = null;
    let secondsLeft = 60;
    let orderState = "cart";
    let selectedOrderType = "dine_in";
    let serviceTaxPercent = 5.0;
    let dialogCallback = null;

    function selectOrderType(type) {
        selectedOrderType = type;
        const btnDine = document.getElementById("btnDineIn");
        const btnPar = document.getElementById("btnParcel");
        if (type === 'dine_in') {
            btnDine.classList.add("active");
            btnPar.classList.remove("active");
        } else {
            btnPar.classList.add("active");
            btnDine.classList.remove("active");
        }
    }

    function showThemedPopup({ title, message, icon="✨", confirmText="OK", cancelText=null, onResolve=null }) {
        document.getElementById("dialogTitle").textContent = title;
        document.getElementById("dialogMsg").textContent = message;
        document.getElementById("dialogIcon").textContent = icon;
        document.getElementById("dialogPrimaryBtn").textContent = confirmText;

        const secondaryBtn = document.getElementById("dialogSecondaryBtn");
        if (cancelText) {
            secondaryBtn.textContent = cancelText;
            secondaryBtn.style.display = "block";
        } else {
            secondaryBtn.style.display = "none";
        }

        dialogCallback = onResolve;
        document.getElementById("customDialogModal").classList.add("open");
    }

    function handleDialogSubmit(isConfirmed) {
        document.getElementById("customDialogModal").classList.remove("open");
        if (dialogCallback) {
            dialogCallback(isConfirmed);
            dialogCallback = null;
        }
    }

    async function handleKitchenCancellation(data) {
        clearInterval(timerInterval);
        clearInterval(pollInterval);

        const reason = data.reason || "The kitchen was unable to accept your order.";
        showThemedPopup({
            title: "Order Cancelled",
            message: `Reason: ${reason}`,
            icon: "❌",
            confirmText: "Understood",
            onResolve: async () => {
                try {
                    await fetch('/api/order/ack-alert', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: data.order_id })
                    });
                } catch (e) {}
                window.location.replace("/menu");
            }
        });
    }

    async function loadCartData() {
        const statusRes = await fetch('/api/order/active');
        const statusData = await statusRes.json();

        if (statusData.service_tax_percent !== undefined) {
            serviceTaxPercent = Number(statusData.service_tax_percent);
        }

        if (statusData.alert && statusData.status === 'cancelled') {
            await handleKitchenCancellation(statusData);
            return;
        }

        if (statusData.has_active_order && statusData.status === 'placed') {
            submittedOrderId = statusData.order_id;
            currentActiveOrder = statusData;
            secondsLeft = statusData.seconds_left !== undefined ? statusData.seconds_left : 60;
            orderState = "awaiting_acceptance";
            if (statusData.order_type) selectOrderType(statusData.order_type);
            await renderCartItems();
            setAwaitingAcceptanceUI();
            return;
        }

        if (statusData.has_active_order && statusData.status !== 'placed' && statusData.payment_status !== 'paid') {
            submittedOrderId = statusData.order_id;
            currentActiveOrder = statusData;
            orderState = "accepted_unpaid";
            if (statusData.order_type) selectOrderType(statusData.order_type);
            await renderCartItems();
            setPayNowUI();
            return;
        }

        orderState = "cart";
        await renderCartItems();
    }

    async function renderCartItems() {
        const res = await fetch('/api/cart/items');
        const data = await res.json();
        const list = document.getElementById('cartItemsList');
        const billBox = document.getElementById('billBox');

        if (!data.items || data.items.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--brown-light); padding:2.5rem 1rem;">Your cart is empty.</p>';
            billBox.style.display = 'none';
            return;
        }

        cartTotal = data.total_price;
        list.innerHTML = '';
        data.items.forEach(item => {
            list.innerHTML += `
                <div class="cart-row">
                    <img src="${item.photo_url}" class="item-thumb" alt="${item.item_name}" onerror="this.src='https://via.placeholder.com/52'">
                    <div class="item-details">
                        <h4>${item.item_name}</h4>
                        <span>${item.category}</span>
                    </div>
                    <div class="item-qty-badge">${item.quantity} pcs</div>
                    <div class="item-line-total">₹${item.line_total.toFixed(2)}</div>
                </div>
            `;
        });

        document.getElementById('totalPayableLabel').textContent = `₹${cartTotal.toFixed(2)}`;
        billBox.style.display = 'block';
    }

    function handleActionButtonClick() {
        if (orderState === "cart") {
            requestOrderAcceptance();
        } else if (orderState === "accepted_unpaid") {
            openPaymentMethodModal();
        }
    }

    function openPaymentMethodModal() {
        const baseAmt = currentActiveOrder ? currentActiveOrder.total_amount : cartTotal;
        const taxVal = Number((baseAmt * (serviceTaxPercent / 100.0)).toFixed(2));
        const onlineTotal = (baseAmt + taxVal).toFixed(2);

        document.getElementById("choiceModalAmountLabel").textContent = `₹${baseAmt.toFixed(2)}`;
        document.getElementById("serviceTaxPercentLabel").textContent = serviceTaxPercent;
        document.getElementById("counterPayLabel").textContent = `Total: ₹${baseAmt.toFixed(2)}`;
        document.getElementById("onlinePayLabel").textContent = `Total: ₹${onlineTotal}`;

        document.getElementById("paymentMethodModal").classList.add("open");
    }

    function closePaymentMethodModal() {
        document.getElementById("paymentMethodModal").classList.remove("open");
    }

    async function executePaymentChoice(method) {
        closePaymentMethodModal();
        if (!currentActiveOrder) return;

        try {
            const res = await fetch('/api/order/select-payment-method', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: currentActiveOrder.order_id,
                    payment_method: method
                })
            });
            const data = await res.json();
            if (data.final_total) {
                currentActiveOrder.total_amount = data.final_total;
            }
        } catch (e) {}

        if (method === 'counter') {
            showThemedPopup({
                title: "Pay at Counter Chosen",
                message: `Please pay ₹${currentActiveOrder.total_amount.toFixed(2)} cash at the hotel counter. Once paid, the cashier will verify your payment and start cooking!`,
                icon: "💵",
                confirmText: "Understood",
                onResolve: () => {
                    window.location.href = "/menu";
                }
            });
        } else {
            launchPaymentFlow(currentActiveOrder);
        }
    }

    async function requestOrderAcceptance() {
        const btn = document.getElementById('mainActionButton');
        btn.disabled = true;
        btn.textContent = "Submitting...";

        try {
            const res = await fetch('/api/order/submit-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_type: selectedOrderType })
            });
            const data = await res.json();

            if (!res.ok) {
                showThemedPopup({
                    title: "Order Failed",
                    message: data.error || "Unable to place order.",
                    icon: "❌"
                });
                btn.disabled = false;
                btn.textContent = "Place Order & Await Acceptance";
                return;
            }

            submittedOrderId = data.order_id;
            orderState = "awaiting_acceptance";
            secondsLeft = 60;
            setAwaitingAcceptanceUI();

        } catch (err) {
            showThemedPopup({
                title: "Network Error",
                message: "Unable to connect to server.",
                icon: "⚠️"
            });
            btn.disabled = false;
            btn.textContent = "Place Order & Await Acceptance";
        }
    }

    function setAwaitingAcceptanceUI() {
        const btn = document.getElementById('mainActionButton');
        const timerBox = document.getElementById('timerBox');
        const typeBox = document.getElementById('orderTypeBox');

        if (typeBox) {
            document.getElementById('btnDineIn').disabled = true;
            document.getElementById('btnParcel').disabled = true;
        }

        timerBox.style.display = 'block';
        btn.disabled = true;
        btn.className = "action-btn";
        btn.textContent = "Awaiting Kitchen...";

        updateTimerDisplay();

        clearInterval(timerInterval);
        clearInterval(pollInterval);

        timerInterval = setInterval(handleTimerTick, 1000);
        pollInterval = setInterval(checkIfAccepted, 1500);
    }

    function setPayNowUI() {
        clearInterval(timerInterval);
        clearInterval(pollInterval);
        timerInterval = null;
        pollInterval = null;

        const timerBox = document.getElementById('timerBox');
        if (timerBox) timerBox.style.display = 'none';

        const typeBox = document.getElementById('orderTypeBox');
        if (typeBox) {
            document.getElementById('btnDineIn').disabled = true;
            document.getElementById('btnParcel').disabled = true;
        }

        const btn = document.getElementById('mainActionButton');
        if (btn) {
            btn.disabled = false;
            btn.className = "action-btn btn-pay-green";
            const amt = currentActiveOrder ? currentActiveOrder.total_amount.toFixed(2) : cartTotal.toFixed(2);
            btn.textContent = `Pay Now (Accepted) - ₹${amt}`;
        }
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
    }

    function handleTimerTick() {
        secondsLeft--;
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            clearInterval(pollInterval);
            handleTimeoutCancellation();
            return;
        }
        updateTimerDisplay();
    }

    async function checkIfAccepted() {
        try {
            const res = await fetch('/api/order/active');
            const data = await res.json();

            if (data.service_tax_percent !== undefined) {
                serviceTaxPercent = Number(data.service_tax_percent);
            }

            if (data.alert && data.status === 'cancelled') {
                await handleKitchenCancellation(data);
                return;
            }

            if (data.has_active_order && data.status !== 'placed') {
                currentActiveOrder = data;
                orderState = "accepted_unpaid";
                setPayNowUI();

                showThemedPopup({
                    title: "Kitchen Accepted Your Order!",
                    message: `Chef accepted Token #${data.daily_order_number}! Click 'Pay Now' to choose your payment option.`,
                    icon: "🎉",
                    confirmText: "Pay Now",
                    cancelText: "Later",
                    onResolve: (confirmed) => {
                        if (confirmed) {
                            openPaymentMethodModal();
                        }
                    }
                });
            }
        } catch (e) {}
    }

    async function handleTimeoutCancellation() {
        await fetch('/api/order/timeout-cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: submittedOrderId })
        });

        showThemedPopup({
            title: "Order Timed Out",
            message: "The kitchen is not accepting orders, please try again in a few minutes.",
            icon: "⏳",
            confirmText: "Back to Menu",
            onResolve: () => {
                window.location.href = "/menu";
            }
        });
    }

    async function launchPaymentFlow(orderData) {
        if (IS_TEST_MODE) {
            const btn = document.getElementById('mainActionButton');
            if (btn) { btn.disabled = true; btn.textContent = "Processing..."; }

            try {
                const payRes = await fetch('/api/payment/confirm-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderData.order_id })
                });
                const payData = await payRes.json();
                
                if (payData.success) {
                    window.location.href = "/menu";
                } else {
                    showThemedPopup({ title: "Payment Error", message: "Failed recording payment.", icon: "❌" });
                    setPayNowUI();
                }
            } catch (err) {
                showThemedPopup({ title: "Network Error", message: "Could not communicate with server.", icon: "⚠️️" });
                setPayNowUI();
            }
            return;
        }

        const options = {
            "key": RZP_KEY_ID,
            "amount": Math.round(orderData.total_amount * 100),
            "currency": "INR",
            "name": "Grand Palace Hotel",
            "description": `Token #${orderData.daily_order_number}`,
            "order_id": orderData.gateway_order_id,
            "prefill": { "name": USER_NAME, "email": USER_EMAIL },
            "theme": { "color": "#10b981" },
            "handler": async function (response) {
                const verifyRes = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    })
                });
                const verifyData = await verifyRes.json();
                if (verifyData.success) {
                    window.location.href = "/menu";
                } else {
                    showThemedPopup({ title: "Verification Failed", message: "Gateway signature verification failed.", icon: "❌" });
                }
            },
            "modal": {
                "ondismiss": function() {
                    setPayNowUI();
                }
            }
        };

        const rzp = new Razorpay(options);
        rzp.open();
    }

    loadCartData();
</script>
<script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(err => console.warn("App setup unavailable", err)));
    }
    let foodAppInstallPrompt;
    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      foodAppInstallPrompt = event;
      const button = document.getElementById("installFoodAppButton");
      if (button) button.hidden = false;
    });
    async function installFoodApp() {
      if (!foodAppInstallPrompt) {
        alert("To install: open your browser menu and choose 'Install app' or 'Add to Home screen'.");
        return;
      }
      foodAppInstallPrompt.prompt();
      await foodAppInstallPrompt.userChoice;
      foodAppInstallPrompt = null;
      const button = document.getElementById("installFoodAppButton");
      if (button) button.hidden = true;
    }
</script>\n</body>
